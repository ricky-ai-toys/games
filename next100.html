<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Amber's Quick Drop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: #111;
  font-family: ui-rounded, "PingFang TC", "Segoe UI", system-ui, sans-serif;
  overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none;
  position: fixed; top: 0; left: 0;
}
#gameContainer {
  position: relative;
  width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center;
}
canvas {
  border: 8px solid #ffcc00;
  box-shadow: 0 0 30px #ffcc00;
  image-rendering: pixelated;
  max-width: 100%; max-height: 100%;
}
#overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  color: white; text-align: center;
  pointer-events: none;
  background: rgba(0,0,0,0.72);
  padding: 16px;
}
#overlay.hidden { display: none; }
#overlay h1 { font-size: 34px; margin: 6px 10px; text-shadow: 0 0 15px #ffcc00; }
#overlay .sub { font-size: 15px; color: #ddd; margin: 4px 10px; line-height: 1.5; }
#overlay .hint { font-size: 13px; color: #ffcc00; margin: 8px 0 16px; }
#diffs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.diff {
  pointer-events: auto;
  min-width: 96px; min-height: 62px;
  padding: 10px 16px;
  font-size: 18px; font-weight: 800;
  background: #ffcc00; color: #222;
  border: none; border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff span { font-size: 11px; font-weight: 600; opacity: .7; }
.diff:active { background: #ffe044; transform: scale(0.97); }
#again { pointer-events: auto; margin-top: 16px; padding: 12px 28px; font-size: 18px; font-weight: 800;
  background: rgba(255,255,255,0.16); color: #fff; border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; cursor: pointer; }
#controls {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
  display: none; justify-content: space-between;
  padding: 10px 15px 20px; pointer-events: none;
}
.ctrl-btn {
  width: 70px; height: 70px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
  color: white; font-size: 28px;
  display: flex; justify-content: center; align-items: center;
  pointer-events: auto;
}
.ctrl-btn:active { background: rgba(255,255,255,0.35); }
.dpad { display: flex; gap: 10px; }
@media (max-width: 768px) {
  canvas { border-width: 4px; }
  #controls { display: flex; }
  #overlay h1 { font-size: 26px; }
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="canvas" width="400" height="600"></canvas>
  <div id="overlay">
    <h1>⬇️ Amber's Quick Drop</h1>
    <p class="sub" id="ov-sub">Dodge the walls and drop as far as you can!</p>
    <p class="hint">← → or A/D · move the mouse · or slide your finger</p>
    <div id="diffs">
      <button class="diff" data-diff="easy">Easy<span id="best-easy">Best 0</span></button>
      <button class="diff" data-diff="medium">Medium<span id="best-medium">Best 0</span></button>
      <button class="diff" data-diff="hard">Hard<span id="best-hard">Best 0</span></button>
    </div>
    <button id="again" style="display:none">Try again</button>
  </div>
  <div id="controls">
    <div class="dpad">
      <div class="ctrl-btn" id="btnLeft">◀</div>
      <div class="ctrl-btn" id="btnRight">▶</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 400, H = 600;

const DIFFS = {
  easy:   { label: 'Easy',   speed: 2.3, ramp: 0.020, leftChance: 0.55, rightChance: 0.55, goal: 50 },
  medium: { label: 'Medium', speed: 3.2, ramp: 0.035, leftChance: 0.68, rightChance: 0.68, goal: 100 },
  hard:   { label: 'Hard',   speed: 4.1, ramp: 0.050, leftChance: 0.80, rightChance: 0.80, goal: 150 },
};

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let diff = 'medium';
let cfg = DIFFS[diff];
let player = { x: 185, y: 260, w: 30, h: 45 };
let obstacles = [];
let floors = [];
let gameSpeed = cfg.speed;
let currentFloor = 0;
let isPlaying = false;
let isOver = false;
let isWin = false;
let mouseX = 200;
let lastTime = 0;
let keys = {};

const bestKey = d => 'quickdrop_best_' + d;
function getBest(d) { return parseInt(lsGet(bestKey(d), '0'), 10) || 0; }
function setBest(d, v) {
  if (v > getBest(d)) lsSet(bestKey(d), String(v));
  const overall = Math.max(getBest('easy'), getBest('medium'), getBest('hard'));
  lsSet('highest100', String(overall)); // keep the portal card reader working
}
function refreshBestLabels() {
  for (const d of ['easy', 'medium', 'hard']) {
    const el = document.getElementById('best-' + d);
    if (el) el.textContent = 'Best ' + getBest(d);
  }
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') { if (!isPlaying) startGame(diff); }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('touchend', e => { e.preventDefault(); });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

function setupBtn(id, key) {
  const btn = document.getElementById(id);
  const on = () => { keys[key] = true; btn.style.background = 'rgba(255,255,255,0.35)'; };
  const off = () => { keys[key] = false; btn.style.background = ''; };
  btn.addEventListener('touchstart', e => { e.preventDefault(); on(); });
  btn.addEventListener('touchend', e => { e.preventDefault(); off(); });
  btn.addEventListener('touchcancel', off);
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
}
setupBtn('btnLeft', 'ArrowLeft');
setupBtn('btnRight', 'ArrowRight');

function rand(min, max) { return Math.random() * (max - min) + min; }

function generateFloor() {
  const lastY = floors.length ? floors[floors.length - 1].y : H + 80;
  const y = lastY + 88;
  floors.push({ y: y, num: currentFloor + floors.length + 1 });

  const hasLeft = Math.random() < cfg.leftChance;
  const hasRight = Math.random() < cfg.rightChance;
  obstacles.push({
    y: y - 8,
    leftW: hasLeft ? rand(72, 155) : 0,
    rightX: hasRight ? rand(245, 325) : W
  });
}

function resetGame() {
  player.x = 185;
  obstacles = [];
  floors = [];
  currentFloor = 0;
  cfg = DIFFS[diff];
  gameSpeed = cfg.speed;
  isOver = false;
  isWin = false;
  lastTime = 0;
  for (let i = 0; i < 7; i++) generateFloor();
}

function startGame(d) {
  diff = DIFFS[d] ? d : 'medium';
  cfg = DIFFS[diff];
  document.getElementById('overlay').classList.add('hidden');
  resetGame();
  isPlaying = true;
  requestAnimationFrame(gameLoop);
}

function checkCollision() {
  if (player.x < 58 || player.x + player.w > 342) return true;
  for (let o of obstacles) {
    if (o.y > H + 10 || o.y < -50) continue;
    if (o.leftW > 0 &&
        player.x < 50 + o.leftW &&
        player.y + player.h > o.y &&
        player.y < o.y + 38) return true;
    if (o.rightX < W &&
        player.x + player.w > o.rightX &&
        player.y + player.h > o.y &&
        player.y < o.y + 38) return true;
  }
  return false;
}

function drawBackground() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#16213e';
  ctx.fillRect(40, 0, 20, H);
  ctx.fillRect(340, 0, 20, H);
  ctx.strokeStyle = '#ffcc88';
  ctx.lineWidth = 3;
  for (let f of floors) {
    if (f.y < -40 || f.y > H + 40) continue;
    ctx.beginPath();
    ctx.moveTo(60, f.y);
    ctx.lineTo(340, f.y);
    ctx.stroke();
    ctx.fillStyle = '#ffeeaa';
    for (let i = 0; i < 3; i++) ctx.fillRect(68 + i * 55, f.y - 18, 20, 11);
    for (let i = 0; i < 3; i++) ctx.fillRect(225 + i * 55, f.y - 18, 20, 11);
  }
}

function drawPlayer() {
  ctx.fillStyle = '#ff3366';
  ctx.fillRect(player.x + 6, player.y + 18, 18, 25);
  ctx.fillStyle = '#ffdd77';
  ctx.beginPath();
  ctx.arc(player.x + 15, player.y + 15, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.fillRect(player.x + 9, player.y + 12, 5, 5);
  ctx.fillRect(player.x + 21, player.y + 12, 5, 5);
}

function drawObstacles() {
  ctx.fillStyle = '#ff6600';
  for (let o of obstacles) {
    if (o.leftW > 0) ctx.fillRect(50, o.y, o.leftW, 35);
    if (o.rightX < W) ctx.fillRect(o.rightX, o.y, W - o.rightX, 35);
  }
}

function endRun(win) {
  isOver = !win;
  isWin = win;
  isPlaying = false;
  setBest(diff, currentFloor);
  refreshBestLabels();
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  const sub = document.getElementById('ov-sub');
  const h1 = ov.querySelector('h1');
  const again = document.getElementById('again');
  again.style.display = 'block';
  again.textContent = 'Try again (' + DIFFS[diff].label + ')';
  again.onclick = () => startGame(diff);
  if (win) {
    h1.textContent = '🌟 You reached the bottom!';
    sub.textContent = 'Amazing! You dropped all ' + cfg.goal + ' floors. Best: ' + getBest(diff);
  } else {
    h1.textContent = 'Nice drop!';
    sub.textContent = 'You reached floor ' + currentFloor + ' of ' + cfg.goal + '. Try again?';
  }
}

function gameLoop(timestamp = 0) {
  if (!isPlaying) return;
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(timestamp - lastTime, 32);
  lastTime = timestamp;
  const factor = dt / 16.67;

  gameSpeed = cfg.speed + currentFloor * cfg.ramp;

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= 7.5 * factor;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += 7.5 * factor;
  player.x += (mouseX - player.x) * 0.28 * factor;
  player.x = Math.max(58, Math.min(W - player.w - 58, player.x));

  const move = gameSpeed * factor;
  for (let o of obstacles) o.y -= move;
  for (let f of floors) f.y -= move;
  obstacles = obstacles.filter(o => o.y > -60);
  floors = floors.filter(f => f.y > -60);

  if (floors.length === 0 || floors[floors.length - 1].y < H + 20) {
    currentFloor++;
    generateFloor();
  }
  while (floors.length > 0 && floors[0].y < player.y + 20) {
    currentFloor = Math.max(currentFloor, floors[0].num);
    floors.shift();
  }

  if (checkCollision()) { endRun(false); drawAll(); return; }
  if (currentFloor >= cfg.goal) { endRun(true); drawAll(); return; }

  drawAll();
  if (isPlaying && !document.hidden) requestAnimationFrame(gameLoop);
}

function drawAll() {
  drawBackground();
  drawObstacles();
  drawPlayer();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 26px ui-rounded, system-ui, sans-serif';
  ctx.fillText('Floor ' + currentFloor, 20, 44);
  ctx.font = '18px ui-rounded, system-ui, sans-serif';
  ctx.fillText('Best ' + Math.max(getBest(diff), currentFloor), 258, 44);
  ctx.font = '14px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle = '#ffcc00';
  ctx.fillText(DIFFS[diff].label + ' · goal ' + cfg.goal, 20, 66);
}

document.querySelectorAll('.diff').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.getAttribute('data-diff')));
});
refreshBestLabels();
</script>
<script src="hardening.js?v=3"></script>
<script>if (window.AmberHardening) AmberHardening.installErrorOverlay();</script>
<script src="playtime.js?v=2"></script>
<script src="pwa.js"></script>
</body>
</html>
