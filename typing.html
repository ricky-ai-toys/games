let audioCtx = null;
let toastIdCounter = 0;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) {}
}
function isMuted() { return window.__muted === true; }
function blip(f0, f1, dur, type, vol) {
  if (!audioCtx || isMuted()) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(kind) {
  if (!audioCtx || isMuted()) return;
  if (kind === 'key') { blip(660, 880, 0.08, 'sine', 0.12); }
  else if (kind === 'word') { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, f, 0.14, 'triangle', 0.14), i * 60)); }
  else if (kind === 'wrong') { blip(180, 90, 0.18, 'square', 0.14); }
  else if (kind === 'lose') { blip(220, 50, 0.5, 'square', 0.18); }
  else if (kind === 'win') { [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, f, 0.3, 'triangle', 0.18), i * 90)); }
  else if (kind === 'pop') { blip(900, 1400, 0.07, 'sine', 0.12); }
}

function useGameLoop(callback, running) {
  const cbRef = useRef(callback);
  cbRef.current = callback;
  useEffect(() => {
    if (!running) return;
    let last = performance.now();
    let raf = 0;
    const tick = (ts) => {
      const dt = Math.min(0.1, (ts - last) / 1000);
      last = ts;
      cbRef.current(dt);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [running]);
}

function useToast() {
  const [toast, setToast] = useState(null);
  const showToast = useCallback((text, color) => {
    const id = ++toastIdCounter;
    setToast({ text, color, id });
    setTimeout(() => setToast(curr => curr && curr.id === id ? null : curr), 1600);
  }, []);
  return [toast, showToast];
}

function useGameStats(paused) {
  const correctRef = useRef(0);
  const totalRef = useRef(0);
  const playTimeRef = useRef(0);
  const pausedRef = useRef(paused);
  pausedRef.current = paused;
  const [hudStats, setHudStats] = useState({ wpm: 0, accuracy: 0, words: 0 });
  const lastHudUpdateRef = useRef(0);
  const tick = useCallback((dt) => {
    if (!pausedRef.current) playTimeRef.current += dt;
    const now = performance.now();
    if (now - lastHudUpdateRef.current > 250) {
      lastHudUpdateRef.current = now;
      const elapsedMin = playTimeRef.current / 60;
      setHudStats({
        wpm: elapsedMin > 0 ? Math.round(correctRef.current / 5 / elapsedMin) : 0,
        accuracy: totalRef.current > 0 ? Math.round(100 * correctRef.current / totalRef.current) : 0,
        words: correctRef.current / 5 | 0,
      });
    }
  }, []);
  const recordCorrect = useCallback(() => { correctRef.current++; totalRef.current++; }, []);
  const recordWrong = useCallback(() => { totalRef.current++; }, []);
  const getFinalStats = useCallback(() => {
    const elapsedMin = playTimeRef.current / 60;
    return {
      wpm: elapsedMin > 0 ? Math.round(correctRef.current / 5 / elapsedMin) : 0,
      accuracy: totalRef.current > 0 ? Math.round(100 * correctRef.current / totalRef.current) : 0,
      words: correctRef.current / 5 | 0,
    };
  }, []);
  return { tick, recordCorrect, recordWrong, getFinalStats, hudStats };
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { try { console.error('Typing game crashed:', err, info); } catch (e) {} }
  render() {
    if (this.state.err) {
      return (
        <div className="overlay menu-screen">
          <div className="menu-card">
            <div className="title" style={{ color: COLORS.danger }}>Oops!</div>
            <div className="subtitle">Something went wrong. Let's start over.</div>
            <div className="btn-row" style={{ marginTop: 12 }}>
              <button className="btn" onClick={() => { try { ['typing_tutorial','typing_pick','typing_lvl','typing_muted','typing_best_wpm'].concat(['fw','bs','wr','st'].flatMap(g=>['easy','med','hard'].map(l=>`typing_best_${g}_${l}`))).forEach(k=>localStorage.removeItem(k)); } catch (e) {} window.location.reload(); }}>Restart</button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function pickWord(level) {
  const list = WORDS[level] || WORDS.med;
  return list[Math.floor(Math.random() * list.length)];
}

function IconButton({ onClick, children, title }) {
  return <button className="icon-btn" onClick={onClick} title={title}>{children}</button>;
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div key={msg.id} className="toast" style={{ color: msg.color || COLORS.accent }}>{msg.text}</div>;
}

function HUD({ score, lives, maxLives, meta, muted, onToggleMute, onPause, wpm, accuracy }) {
  return (
    <div className="hud">
      <div className="hud-left">
        <div className="score">{'\u2605'}{score}</div>
        <div className="meta">{meta}</div>
      </div>
      <div className="hud-right">
        <div className="lives">{'\u2665'.repeat(Math.max(0, lives))}<span style={{opacity:0.25}}>{'\u2665'.repeat(Math.max(0, maxLives - lives))}</span></div>
        {(wpm !== undefined) && <div className="meta">{wpm} WPM · {accuracy}%</div>}
        <div className="hud-buttons">
          <IconButton onClick={onToggleMute} title={muted ? 'Sound off' : 'Sound on'}>{muted ? '\u{1F507}' : '\u{1F50A}'}</IconButton>
          <IconButton onClick={onPause} title="Pause">{'\u23F8'}</IconButton>
        </div>
      </div>
    </div>
  );
}

function FallingWords({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const cfg = DIFFICULTIES[level];
  const [words, setWords] = useState([]);
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(cfg.lives);
  const [toast, showToast] = useToast();
  const wordIdRef = useRef(0);
  const spawnAccRef = useRef(0);
  const gameOverRef = useRef(false);
  const wordsRef = useRef([]);
  wordsRef.current = words;
  const stats = useGameStats(paused);

  useGameLoop(useCallback((dt) => {
    if (gameOverRef.current) return;
    stats.tick(dt);
    const curr = wordsRef.current;
    let lost = 0;
    const next = curr.map(w => {
      if (w.popping) return { ...w, popT: w.popT + dt };
      return { ...w, y: w.y + cfg.speed * dt };
    }).filter(w => {
      if (w.popping) return w.popT < 0.5;
      if (w.y > 96) { lost++; return false; }
      return true;
    });
    if (lost > 0) {
      setLives(l => Math.max(0, l - lost));
      sfx('wrong');
    }
    setWords(next);
    spawnAccRef.current += dt;
    if (spawnAccRef.current >= cfg.spawn) {
      spawnAccRef.current = 0;
      const base = wordsRef.current;
      if (base.length <= 6) {
        const id = ++wordIdRef.current;
        const text = pickWord(level);
        const x = 10 + Math.random() * 80;
        setWords([...base, { id, text, x, y: 8, typed: 0, popping: false, popT: 0 }]);
      }
    }
  }, [cfg.speed, cfg.spawn, level, stats]), !paused);

  useEffect(() => {
    if (lives <= 0 && !gameOverRef.current) {
      gameOverRef.current = true;
      sfx('lose');
      const { wpm, accuracy, words: wc } = stats.getFinalStats();
      const finalScore = score;
      setTimeout(() => onFinish({ score: finalScore, wpm, accuracy, words: wc }), 700);
    }
  }, [lives]);

  const handleKey = useCallback((e) => {
    if (gameOverRef.current) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const ch = e.key.toLowerCase();
    if (ch.length !== 1 || !/[a-z]/.test(ch)) return;
    e.preventDefault();
    setWords(curr => {
      let matched = -1;
      for (let i = 0; i < curr.length; i++) {
        const w = curr[i];
        if (w.popping) continue;
        if (w.text[w.typed] === ch) { matched = i; break; }
      }
      if (matched < 0) {
        stats.recordWrong();
        sfx('wrong');
        return curr.map(w => w.typed > 0 ? { ...w, wrong: true } : w);
      }
      const w = curr[matched];
      const newTyped = w.typed + 1;
      stats.recordCorrect();
      sfx('key');
      if (newTyped >= w.text.length) {
        setScore(s => s + 10);
        showToast('Word!', COLORS.accent);
        sfx('word');
        return curr.map((x, i) => i === matched ? { ...x, typed: newTyped, popping: true, popT: 0, wrong: false } : x);
      }
      return curr.map((x, i) => i === matched ? { ...x, typed: newTyped, wrong: false } : x);
    });
  }, [showToast, stats]);

  useEffect(() => {
    if (paused) return;
    document.addEventListener('keydown', handleKey);
    return () => document.removeEventListener('keydown', handleKey);
  }, [handleKey, paused]);

  useEffect(() => {
    const t = setTimeout(() => {
      setWords(curr => curr.map(w => ({ ...w, wrong: false })));
    }, 250);
    return () => clearTimeout(t);
  }, [words]);

  const { wpm, accuracy } = stats.hudStats;

  return (
    <>
      <div className="stage" />
      <HUD score={score} lives={lives} maxLives={cfg.lives}
           meta={`Falling Words · ${cfg.label}`}
           muted={muted} wpm={wpm} accuracy={accuracy}
           onToggleMute={toggleMute}
           onPause={onPause} />
      {words.map(w => (
        <div key={w.id} className={`word ${w.typed > 0 ? 'typed' : ''} ${w.wrong ? 'wrong' : ''} ${w.popping ? 'popping' : ''}`}
             style={{ left: `${w.x}%`, top: `${w.y}%` }}>
          <span className="done">{w.text.slice(0, w.typed)}</span>
          <span className="todo">{w.text.slice(w.typed)}</span>
        </div>
      ))}
      <Toast msg={toast} />
    </>
  );
}

function BubbleSpell({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const cfg = DIFFICULTIES[level];
  const [target, setTarget] = useState(() => pickWord(level));
  const [targetDone, setTargetDone] = useState(0);
  const [bubbles, setBubbles] = useState([]);
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(cfg.lives);
  const [toast, showToast] = useToast();
  const idRef = useRef(0);
  const spawnAccRef = useRef(0);
  const gameOverRef = useRef(false);
  const bubblesRef = useRef([]);
  const targetDoneRef = useRef(0);
  const targetRef = useRef(target);
  bubblesRef.current = bubbles;
  targetRef.current = target;
  targetDoneRef.current = targetDone;
  const stats = useGameStats(paused);

  useEffect(() => {
    if (targetDone >= target.length) {
      sfx('word');
      setScore(s => s + target.length * 8);
      showToast('Spell!', COLORS.accent);
      setTargetDone(0);
      setTarget(pickWord(level));
    }
  }, [targetDone, target, level, showToast]);

  useGameLoop(useCallback((dt) => {
    if (gameOverRef.current) return;
    stats.tick(dt);
    const curr = bubblesRef.current;
    let lost = 0;
    const next = curr.map(b => {
      if (b.popping) return { ...b, popT: b.popT + dt };
      return { ...b, y: b.y - (cfg.speed * 0.7) * dt };
    }).filter(b => {
      if (b.popping) return b.popT < 0.5;
      if (b.y < 6 && !b.popping) {
        if (b.needed) lost++;
        return false;
      }
      return true;
    });
    if (lost > 0) {
      setLives(l => Math.max(0, l - lost));
      sfx('wrong');
    }
    setBubbles(next);
    spawnAccRef.current += dt;
    if (spawnAccRef.current >= 1.0) {
      spawnAccRef.current = 0;
      const base = bubblesRef.current;
      if (base.length <= 8) {
        const neededIdx = targetDoneRef.current;
        const t = targetRef.current;
        const needMore = neededIdx < t.length;
        const hasNeeded = base.some(b => b.needed && !b.popping);
        const wantNeeded = needMore && (!hasNeeded || Math.random() < 0.85);
        const letter = wantNeeded
          ? t[neededIdx]
          : WORDS[level][Math.floor(Math.random() * WORDS[level].length)][0];
        const id = ++idRef.current;
        setBubbles([...base, {
          id, letter,
          x: 10 + Math.random() * 80,
          y: 105,
          needed: wantNeeded && letter === t[neededIdx],
          popping: false, popT: 0,
        }]);
      }
    }
  }, [cfg.speed, level, stats]), !paused);

  useEffect(() => {
    if (lives <= 0 && !gameOverRef.current) {
      gameOverRef.current = true;
      sfx('lose');
      const { wpm, accuracy, words: wc } = stats.getFinalStats();
      const finalScore = score;
      setTimeout(() => onFinish({ score: finalScore, wpm, accuracy, words: wc }), 700);
    }
  }, [lives]);

  const handleKey = useCallback((e) => {
    if (gameOverRef.current) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const ch = e.key.toLowerCase();
    if (ch.length !== 1 || !/[a-z]/.test(ch)) return;
    e.preventDefault();
    const curr = bubblesRef.current;
    let matched = -1;
    for (let i = 0; i < curr.length; i++) {
      const b = curr[i];
      if (b.popping) continue;
      if (b.letter === ch) { matched = i; break; }
    }
    if (matched < 0) {
      stats.recordWrong();
      sfx('wrong');
      return;
    }
    const b = curr[matched];
    stats.recordCorrect();
    sfx('pop');
    if (b.needed) setTargetDone(d => d + 1);
    setBubbles(curr.map((x, i) => i === matched ? { ...x, popping: true, popT: 0 } : x));
  }, [stats]);

  useEffect(() => {
    if (paused) return;
    document.addEventListener('keydown', handleKey);
    return () => document.removeEventListener('keydown', handleKey);
  }, [handleKey, paused]);

  const { wpm, accuracy } = stats.hudStats;

  return (
    <>
      <div className="stage stage-bubbles" />
      <HUD score={score} lives={lives} maxLives={cfg.lives}
           meta={`Bubble Spell · ${cfg.label}`}
           muted={muted} wpm={wpm} accuracy={accuracy}
           onToggleMute={toggleMute}
           onPause={onPause} />
      <div className="target-word">
        <span className="done">{target.slice(0, targetDone)}</span>
        <span className="todo">{target.slice(targetDone)}</span>
      </div>
      {bubbles.map(b => (
        <div key={b.id} className={`bubble ${b.needed && !b.popping ? 'needed' : ''} ${b.popping ? 'popping' : ''}`}
             style={{ left: `${b.x}%`, top: `${b.y}%` }}>
          {b.letter.toUpperCase()}
        </div>
      ))}
      <Toast msg={toast} />
    </>
  );
}

function WordRace({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const cfg = DIFFICULTIES[level];
  const GOAL = cfg.goal;
  const ROUND_TIME = 60;
  const [target, setTarget] = useState(() => pickWord(level));
  const [typed, setTyped] = useState(0);
  const [score, setScore] = useState(0);
  const [distance, setDistance] = useState(0);
  const [jumping, setJumping] = useState(false);
  const [time, setTime] = useState(ROUND_TIME);
  const [toast, showToast] = useToast();
  const gameOverRef = useRef(false);
  const wonRef = useRef(false);
  const distanceRef = useRef(0);
  distanceRef.current = distance;
  const stats = useGameStats(paused);

  useEffect(() => {
    if (typed >= target.length) {
      sfx('word');
      setScore(s => s + 25);
      setDistance(d => Math.min(GOAL, d + 30));
      setJumping(true);
      setTimeout(() => setJumping(false), 250);
      showToast('+25', COLORS.accent);
      setTyped(0);
      setTarget(pickWord(level));
    }
  }, [typed, target, level, showToast, GOAL]);

  const finishRace = useCallback((reachedGoal) => {
    if (gameOverRef.current) return;
    gameOverRef.current = true;
    sfx(reachedGoal ? 'win' : 'lose');
    const { wpm, accuracy, words: wc } = stats.getFinalStats();
    const finalScore = score + (reachedGoal ? Math.ceil(time * 5) : 0);
    const finalDistance = distanceRef.current;
    setTimeout(() => onFinish({ score: finalScore, wpm, accuracy, words: wc, distance: finalDistance, won: reachedGoal }), 700);
  }, [score, time, onFinish, stats]);

  useEffect(() => {
    if (wonRef.current) return;
    if (distanceRef.current >= GOAL) {
      wonRef.current = true;
      setTimeout(() => finishRace(true), 200);
    }
  });

  useGameLoop(useCallback((dt) => {
    if (gameOverRef.current) return;
    stats.tick(dt);
    setTime(t => {
      if (t <= dt) { finishRace(false); return 0; }
      return t - dt;
    });
    setDistance(d => Math.min(GOAL, d + 6 * dt));
  }, [finishRace, stats]), !paused);

  const handleKey = useCallback((e) => {
    if (gameOverRef.current) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const ch = e.key.toLowerCase();
    if (ch.length !== 1 || !/[a-z]/.test(ch)) return;
    e.preventDefault();
    if (target[typed] === ch) {
      stats.recordCorrect();
      sfx('key');
      setTyped(t => t + 1);
    } else {
      stats.recordWrong();
      sfx('wrong');
      setDistance(d => Math.max(0, d - 5));
    }
  }, [target, typed, stats]);

  useEffect(() => {
    if (paused) return;
    document.addEventListener('keydown', handleKey);
    return () => document.removeEventListener('keydown', handleKey);
  }, [handleKey, paused]);

  const { wpm, accuracy } = stats.hudStats;
  const progress = Math.min(1, distance / GOAL);
  const runnerLeft = 6 + progress * 88;

  return (
    <>
      <div className="stage stage-race" />
      <HUD score={score} lives={999} maxLives={999}
           meta={`Word Race · ${cfg.label} · ${distance | 0}/${GOAL}m`}
           muted={muted} wpm={wpm} accuracy={accuracy}
           onToggleMute={toggleMute}
           onPause={onPause} />
      <div className="timer-bar"><div style={{ width: `${(time / ROUND_TIME) * 100}%` }} /></div>
      <div className="runner-words">
        <div className="runner-word active">
          <span className="done">{target.slice(0, typed)}</span>
          <span className="todo">{target.slice(typed)}</span>
        </div>
      </div>
      <div className="runner-track" />
      <div className="runner-track-progress" style={{ width: `${progress * 100}%` }} />
      <div className="finish-line" />
      <div className={`runner run ${jumping ? 'jumping' : ''}`} style={{ left: `${runnerLeft}%` }}>{'\u{1F98A}'}</div>
      <Toast msg={toast} />
    </>
  );
}

function GameOver({ result, game, level, onReplay, onMenu, best }) {
  const newRecord = result.score > best;
  const won = result.won;
  const title = game === 'wr' ? (won ? 'You Win!' : "Time's Up!") : "Time's Up!";
  const titleColor = won ? COLORS.sec1 : COLORS.accent;
  return (
    <div className="overlay menu-screen">
      <div className="menu-card">
        <div className="title" style={{ color: titleColor }}>{title}</div>
        <div className="subtitle">{GAMES.find(g => g.id === game).name} · {DIFFICULTIES[level].label}</div>
        <div className="stat-line">
          <div className="stat"><div className="v">{'\u2605'}{result.score}</div><div className="l">Score</div></div>
          <div className="stat"><div className="v">{result.wpm}</div><div className="l">WPM</div></div>
          <div className="stat"><div className="v">{result.accuracy}%</div><div className="l">Accuracy</div></div>
          <div className="stat"><div className="v">{result.words || 0}</div><div className="l">Words</div></div>
        </div>
        {newRecord && <div className="best record" style={{ marginTop: 14 }}>{'\u{1F3C6}'} New Record!</div>}
        {!newRecord && best > 0 && <div className="best">Best: <span className="record">{'\u2605'}{best}</span></div>}
        <div className="btn-row" style={{ marginTop: 16 }}>
          <button className="btn" onClick={onReplay}>Play Again</button>
          <button className="btn btn-secondary" onClick={onMenu}>Back to Menu</button>
        </div>
      </div>
    </div>
  );
}

function PauseOverlay({ onResume, onMenu }) {
  return (
    <div className="overlay pause-overlay">
      <div className="menu-card">
        <div className="title" style={{ fontSize: 'clamp(28px, 6vw, 48px)' }}>Paused</div>
        <div className="subtitle" style={{ marginBottom: 18 }}>Take a break!</div>
        <div className="btn-row">
          <button className="btn" onClick={onResume}>Resume</button>
          <button className="btn btn-ghost" onClick={onMenu}>Back to Menu</button>
        </div>
      </div>
    </div>
  );
}

function Tutorial({ onDismiss }) {
  const [show, setShow] = useState(true);
  if (!show) return null;
  return (
    <div className="overlay" style={{zIndex: 30, pointerEvents: 'auto'}}>
      <div className="menu-card" style={{maxWidth: 340}}>
        <div className="title" style={{fontSize: 28}}>How to Play</div>
        <div className="subtitle" style={{fontSize: 13, opacity: 0.8, marginBottom: 8}}>
          Pick a game and difficulty to start typing!
        </div>
        <ul style={{textAlign: 'left', fontSize: 13, lineHeight: 1.5, opacity: 0.8, paddingLeft: 20, marginBottom: 12}}>
          <li>Falling Words: type the word before it hits the ground</li>
          <li>Bubble Spell: pop bubbles by typing the word inside</li>
          <li>Word Race: type words quickly to race forward</li>
          <li>Sentences: type full sentences with spaces</li>
        </ul>
        <div className="btn-row">
          <button className="btn" onClick={() => { try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {} setShow(false); onDismiss(); }}>Let's Go!</button>
        </div>
      </div>
    </div>
  );
}

function Menu({ onStart, bests, muted, toggleMute }) {
  const [showTut, setShowTut] = useState(() => { try { return !localStorage.getItem(TUTORIAL_KEY); } catch (e) { return false; } });
  const [selected, setSelected] = useState(() => { try { return localStorage.getItem('typing_pick') || 'fw'; } catch(e){ return 'fw'; } });
  const [level, setLevel] = useState(() => { try { return localStorage.getItem('typing_lvl') || 'med'; } catch(e){ return 'med'; } });

  useEffect(() => { localStorage.setItem('typing_pick', selected); }, [selected]);
  useEffect(() => { localStorage.setItem('typing_lvl', level); }, [level]);

  const handleStart = () => { initAudio(); onStart(selected, level); };

  return (
    <div className="overlay menu-screen">
      {showTut && <Tutorial onDismiss={() => setShowTut(false)} />}
      <div className="menu-card">
        <div className="title">Amber's Typing</div>
        <div className="subtitle">Pick a game and start typing!</div>
        <div className="game-grid">
          {GAMES.map(g => (
            <div key={g.id} className={`game-card ${selected === g.id ? 'selected' : ''}`} onClick={() => setSelected(g.id)}>
              <div className="mascot">{g.mascot}</div>
              <div className="name">{g.name}</div>
              <div className="blurb">{g.blurb}</div>
            </div>
          ))}
        </div>
        <div className="diff-row">
          <span>Difficulty:</span>
          {['easy','med','hard'].map(d => (
            <button key={d} className={`diff-btn ${level === d ? 'active' : ''}`} onClick={() => setLevel(d)}>
              {DIFFICULTIES[d].label}
            </button>
          ))}
        </div>
        <div className="btn-row">
          <button className="btn" onClick={handleStart}>Start Game</button>
          <button className="btn btn-ghost" onClick={toggleMute}>
            {muted ? '\u{1F507} Muted' : '\u{1F50A} Sound'}
          </button>
          <button className="btn btn-ghost" onClick={() => { try { localStorage.removeItem(TUTORIAL_KEY); } catch (e) {} setShowTut(true); }}>?</button>
        </div>
        {bests.fw[level] > 0 || bests.bs[level] > 0 || bests.wr[level] > 0 ? (
          <div className="best" style={{ marginTop: 12 }}>
            <span className="record">Best ({DIFFICULTIES[level].label})</span>:
            {' '}{'\u{1F427}'} {bests.fw[level]} ·
            {' '}{'\u{1F989}'} {bests.bs[level]} ·
            {' '}{'\u{1F98A}'} {bests.wr[level]}
          </div>
        ) : <div className="best">Type your first word!</div>}
      </div>
    </div>
  );
}

function Sentences({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const cfg = DIFFICULTIES[level];
  const pool = SENTENCES[level];
  const [idx, setIdx] = useState(0);
  const [typed, setTyped] = useState('');
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [lives, setLives] = useState(cfg.lives);
  const [toast, showToast] = useToast();
  const [shake, setShake] = useState(false);
  const target = pool[idx % pool.length];
  const stats = useGameStats(paused);
  const finishedRef = useRef(false);
  const typedRef = useRef('');
  typedRef.current = typed;
  const streakRef = useRef(0);
  streakRef.current = streak;

  useEffect(() => {
    if (lives <= 0 && !finishedRef.current) {
      finishedRef.current = true;
      sfx('lose');
      const { wpm, accuracy, words: wc } = stats.getFinalStats();
      setTimeout(() => onFinish({ score, wpm, accuracy, words: wc }), 700);
    }
  }, [lives]);

  useEffect(() => {
    if (typed === target && target.length > 0) {
      const newStreak = streakRef.current + 1;
      setStreak(newStreak);
      sfx('word');
      setScore(s => s + target.length * 5 + (newStreak >= 5 ? 50 : 0));
      stats.recordCorrect();
      showToast('Sentence! +' + (target.length * 5), COLORS.accent);
      if (accuracyMilestone(stats.hudStats.accuracy, newStreak)) confetti();
      setTimeout(() => { setIdx(i => i + 1); setTyped(''); }, 300);
    }
  }, [typed]);

  const handleKey = useCallback((e) => {
    if (finishedRef.current || paused) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k.length !== 1 && k !== ' ') return;
    if (k === ' ') e.preventDefault();
    const ch = k === ' ' ? ' ' : k.toLowerCase();
    const expected = target[typedRef.current.length];
    if (ch === expected) {
      stats.recordCorrect();
      setTyped(t => t + ch);
    } else {
      stats.recordWrong();
      sfx('wrong');
      setShake(true);
      setTimeout(() => setShake(false), 200);
      setLives(l => Math.max(0, l - 1));
      setStreak(0);
      showToast('Try again', COLORS.danger);
    }
  }, [target, stats]);

  useEffect(() => {
    document.addEventListener('keydown', handleKey);
    return () => document.removeEventListener('keydown', handleKey);
  }, [handleKey]);

  const { wpm, accuracy } = stats.hudStats;
  const accuracyPct = accuracy;
  return (
    <>
      <div className="stage stage-bubbles" />
      <HUD score={score} lives={lives} maxLives={cfg.lives}
           meta={`Sentences · ${cfg.label} · \u{1F525} ${streak}${streak >= 3 ? ' \u{1F947}' : streak >= 6 ? ' \u{1F948}' : ''}`}
           muted={muted} wpm={wpm} accuracy={accuracyPct}
           onToggleMute={toggleMute}
           onPause={onPause} />
      <div className={`target-sentence ${shake ? 'shake' : ''}`}>
        {target.split('').map((ch, i) => (
          <span key={i} className={i < typed.length ? 'ch-done' : i === typed.length ? 'ch-cursor' : 'ch-todo'}>
            {ch === ' ' ? '\u00A0' : ch}
          </span>
        ))}
      </div>
      <Toast msg={toast} />
    </>
  );
}

function confetti() {
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.background = ['#FF8A65','#5FFBF1','#FFD54F','#66BB6A','#AB47BC'][i % 5];
    el.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

function accuracyMilestone(accuracy, streak) {
  return accuracy === 100 && streak >= 5;
}

function App() {
window.addEventListener('error', function(e){ try{ if(window.__amberErr)return; window.__amberErr=1; var d=document.createElement('div'); d.setAttribute('role','alert'); d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;'; d.innerHTML='<div style="font-size:48px;margin-bottom:16px">🦊</div><div style="font-size:18px;margin-bottom:24px">Oops! Reload and try again.</div><button onclick="location.reload()" style="font-size:16px;padding:12px 24px;border:none;border-radius:8px;background:#f5a623;color:#1a1a2e;cursor:pointer;font-weight:bold;">Reload</button>'; document.body.appendChild(d); }catch(_){} });
  const [screen, setScreen] = useState('menu');
  const [game, setGame] = useState(null);
  const [level, setLevel] = useState('med');
  const [result, setResult] = useState(null);
  const [playKey, setPlayKey] = useState(0);
  const [paused, setPaused] = useState(false);
  const [muted, setMuted] = useState(() => {
    try { return localStorage.getItem('typing_muted') === '1'; } catch (e) { return false; }
  });
  const [bests, setBests] = useState(() => {
    const out = { fw: { easy: 0, med: 0, hard: 0 }, bs: { easy: 0, med: 0, hard: 0 }, wr: { easy: 0, med: 0, hard: 0 }, st: { easy: 0, med: 0, hard: 0 } };
    try {
      for (const g of ['fw','bs','wr','st']) for (const l of ['easy','med','hard']) {
        const v = parseInt(localStorage.getItem(`typing_best_${g}_${l}`) || '0', 10);
        if (!isNaN(v)) out[g][l] = v;
      }
    } catch (e) {}
    return out;
  });
  const [bestWpm, setBestWpm] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem(`typing_best_wpm`) || '0', 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  });

  const toggleMute = useCallback(() => {
    setMuted(m => {
      const next = !m;
      try { localStorage.setItem('typing_muted', next ? '1' : '0'); } catch (e) {}
      window.__muted = next;
      return next;
    });
  }, []);

  useEffect(() => { window.__muted = muted; }, [muted]);

  const onStart = (g, l) => { setGame(g); setLevel(l); setResult(null); setPaused(false); setPlayKey(k => k + 1); setScreen('play'); };
  const onFinish = (r) => {
    setResult(r);
    if (r.score > 0) {
      setBests(curr => {
        const next = { ...curr, [game]: { ...curr[game], [level]: Math.max(curr[game][level], r.score) } };
        try { localStorage.setItem(`typing_best_${game}_${level}`, String(next[game][level])); } catch (e) {}
        return next;
      });
    }
    if (r.wpm && r.wpm > bestWpm) {
      setBestWpm(r.wpm);
      try { localStorage.setItem(`typing_best_wpm`, String(r.wpm)); } catch (e) {}
    }
    setScreen('over');
  };
  const onPause = () => setPaused(true);
  const onResume = () => setPaused(false);
  const onReplay = () => { setResult(null); setPaused(false); setPlayKey(k => k + 1); setScreen('play'); };
  const onMenu = () => { setScreen('menu'); setResult(null); setPaused(false); };

  return (
    <>
      {screen === 'menu' && <Menu onStart={onStart} bests={bests} muted={muted} toggleMute={toggleMute} />}
      {screen === 'play' && game === 'fw' && <FallingWords key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && game === 'bs' && <BubbleSpell key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && game === 'wr' && <WordRace key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && game === 'st' && <Sentences key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && paused && <PauseOverlay onResume={onResume} onMenu={onMenu} />}
      {screen === 'over' && <GameOver result={result} game={game} level={level} best={bests[game][level]} onReplay={onReplay} onMenu={onMenu} />}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
document.addEventListener('visibilitychange',function(){if(document.hidden){if(typeof audioCtx!=='undefined'&&audioCtx&&audioCtx.suspend)audioCtx.suspend();}else{if(typeof audioCtx!=='undefined'&&audioCtx&&audioCtx.resume)audioCtx.resume().catch(function(){});}});
</script>
<script src="hardening.js?v=2"></script>
<script src="playtime.js?v=2"></script>
<script src="pwa.js"></script>
</body>
