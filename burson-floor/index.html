<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Hidden / not for kids: keep out of search + previews -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta property="og:robots" content="noindex">

<title>Burson Floor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: #0a0e1a;
    color: #e7ecff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background:
      radial-gradient(720px 420px at 50% -10%, rgba(66,165,245,0.12), transparent 60%),
      linear-gradient(180deg, #0e1424 0%, #0a0e1a 100%);
  }
  .lock { font-size: 44px; line-height: 1; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  .gate-title {
    font-size: 15px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 800; color: #9fb0e0;
  }
  .gate-sub { font-size: 13px; color: #6c7aa6; max-width: 320px; line-height: 1.5; }
  .row { display: flex; gap: 10px; margin-top: 6px; }
  #code {
    width: 220px; max-width: 70vw;
    padding: 13px 16px; font: inherit; font-size: 16px; font-weight: 700;
    color: #f3f6ff; text-align: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 14px; outline: none;
    letter-spacing: .12em;
  }
  #code:focus { border-color: rgba(95,251,241,0.45); }
  #go {
    padding: 13px 20px; font: inherit; font-size: 15px; font-weight: 800;
    color: #06121f; cursor: pointer;
    background: linear-gradient(135deg, #ffd180, #ff8a65);
    border: none; border-radius: 14px;
    box-shadow: 0 8px 0 #c75b39, 0 12px 20px -10px rgba(0,0,0,.5);
    transition: transform .12s ease;
  }
  #go:active { transform: translateY(2px); box-shadow: 0 6px 0 #c75b39; }
  .msg { min-height: 18px; font-size: 13px; font-weight: 700; color: #ff8a80; }
  .foot { position: fixed; bottom: 14px; font-size: 11px; color: #4a557a; letter-spacing: .04em; }
  #game-frame { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0a0e1a; }
</style>
</head>
<body>
  <div id="gate">
    <div class="lock" aria-hidden="true">🔒</div>
    <div class="gate-title">Restricted</div>
    <div class="gate-sub">This workspace is for grown-ups only. Enter the access code to continue.</div>
    <div class="row">
      <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="access code" autofocus>
      <button id="go" type="button">Unlock</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <iframe id="game-frame" src="about:blank" title="Burson Floor" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
  <div class="foot">Burson Floor · internal</div>

<script>
  // SHA-256 of the access code (no plaintext in source).
  var EXPECTED = "78659827c3a1a0d7fbd2df89cc87b542c351bfde9b7f951f6a76fdf9c7c77b62";
  function hex(buffer) {
    return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
      return ('00' + b.toString(16)).slice(-2);
    }).join('');
  }
  var FALLBACK = 'burson2026'; // used only when crypto.subtle is unavailable (non-HTTPS)
  function reveal() {
    var msg = document.getElementById('msg');
    msg.textContent = '';
    document.getElementById('gate').style.display = 'none';
    var frame = document.getElementById('game-frame');
    frame.src = 'play.html';
    frame.style.display = 'block';
    try { history.replaceState(null, '', './'); } catch (e) {}
  }
  function deny() {
    var msg = document.getElementById('msg');
    msg.textContent = 'Access denied.';
    var c = document.getElementById('code');
    c.value = '';
    c.focus();
  }
  function unlock() {
    var msg = document.getElementById('msg');
    var val = document.getElementById('code').value;
    if (!val) { msg.textContent = 'Enter the code.'; return; }
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(function (h) {
        if (hex(h) === EXPECTED) reveal(); else deny();
      }).catch(deny);
    } else {
      // Non-secure context (e.g. plain http://): fall back to direct compare.
      if (val === FALLBACK) reveal(); else deny();
    }
  }
  document.getElementById('go').addEventListener('click', unlock);
  document.getElementById('code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock();
  });
</script>
</body>
</html>
