<style>

  .pick {

    border: 2px solid var(--border); background: rgba(255,255,255,0.07);

  }

    from { transform: scale(0.94); }
    to { transform: scale(1); }
  }

  .color-dot {

  .section-label {
    font-weight: 800; margin: 4px 0 8px; font-size: 13px; opacity: 0.9;

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

let audioCtx = null;
function audio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
function blip(freq, dur, type, muted) {
  if (muted) return;
  const ctx = audio(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = 0.1;
  const t = ctx.currentTime;
  o.connect(g); g.connect(ctx.destination);
  o.start(t); g.gain.linearRampToValueAtTime(0.0001, t + dur); o.stop(t + dur + 0.02);
}

function productTags(look) {
  const tags = [];
  if (look.hair) {
    const h = HAIR.find(x => x.id === look.hair.style);
    if (h) tags.push(...h.tags);
    if (look.hair.color) tags.push('color:' + look.hair.color);
  }
  if (look.makeup) {
    const m = MAKEUP.find(x => x.id === look.makeup);
    if (m) tags.push(...m.tags);
  }
  if (look.nails) {
    const n = NAILS.find(x => x.id === look.nails);
    if (n) tags.push(...n.tags);
  }
  if (look.acc) {
    const a = ACC.find(x => x.id === look.acc);
    if (a) tags.push(...a.tags);
  }
  return tags;
}

function scoreLook(look, want, difficulty) {
  const filled = [look.hair, look.makeup, look.nails, look.acc].filter(Boolean).length;
  const fillPts = filled === 4 ? 25 : filled * 5;
  const have = productTags(look);
  const matches = want.filter(w => have.includes(w));
  const need = LEVELS[difficulty].need;
  let matchPts = 0;
  matches.forEach((_, i) => { matchPts += i < need ? 20 : 8; });
  let bonus = 0;
  const colors = have.filter(t => t.startsWith('color:'));
  if (colors.length >= 1 && have.some(t => t.includes('sparkle') || t.includes('glitter'))) bonus += 5;
  if (difficulty === 'hard' && matches.length >= want.length) bonus += 10;
  if (difficulty === 'easy' && matches.length >= 2) matchPts = Math.max(matchPts, 40);
  return Math.min(100, fillPts + matchPts + bonus);
}

function matchCount(look, want) {
  const have = productTags(look);
  return want.filter(w => have.includes(w)).length;
}

  const bits = useMemo(() => {
    const colors = ['#FF8A65', '#E91E63', '#FFD700', '#69F0AE', '#42A5F5', '#CE93D8', '#fff'];
    const n = count || 28;
    const arr = [];
    for (let i = 0; i < n; i++) {
      arr.push({
        left: Math.random() * 100,
        delay: Math.random() * 0.6,
        dur: 1.6 + Math.random() * 1.4,
        color: colors[i % colors.length],
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 10,
        rot: Math.random() * 360,
      });
    }
    return arr;
  }, [count]);
  return (
    <div className="confetti" aria-hidden="true">
      {bits.map((b, i) => (
        <i
          key={i}
          style={{
            left: b.left + '%',
            width: b.w,
            height: b.h,
            background: b.color,
            animationDuration: b.dur + 's',
            animationDelay: b.delay + 's',
            transform: 'rotate(' + b.rot + 'deg)',
          }}
        />
      ))}
    </div>
  );
}

function DesignScreen({ customer, difficulty, free, muted, onDone, onBack, progressLabel }) {
  const [station, setStation] = useState('hair');
  const [look, setLook] = useState({ hair: null, makeup: null, nails: null, acc: null });
  const [hairColor, setHairColor] = useState('pink');
  const [history, setHistory] = useState([]);
  const [toast, setToast] = useState(null);
  const [faceTick, setFaceTick] = useState(0);
  const [scoreBump, setScoreBump] = useState(false);

  const applyLook = (next, bumpFace) => {
    setHistory(h => h.length > 20 ? h.slice(-20).concat([look]) : h.concat([look]));
    setLook(next);
    if (bumpFace) setFaceTick(t => t + 1);
  };

  const pick = (stationId, id) => {
    blip(660, 0.08, 'sine', muted);
    const next = { ...look };
    if (stationId === 'hair') next.hair = { style: id, color: hairColor };
    else if (stationId === 'makeup') next.makeup = id;
    else if (stationId === 'nails') next.nails = id;
    else next.acc = id;
    applyLook(next, true);
  };

  useEffect(() => {
    if (look.hair && look.hair.color !== hairColor) {
      setLook(prev => prev.hair ? { ...prev, hair: { ...prev.hair, color: hairColor } } : prev);
    }
  }, [hairColor]);

  const prevScore = React.useRef(0);
  const liveScore = customer && !free ? scoreLook(look, customer.want, difficulty) : 0;
  useEffect(() => {
    if (!free && liveScore > prevScore.current) {
      setScoreBump(true);
      const t = setTimeout(() => setScoreBump(false), 200);
      prevScore.current = liveScore;
      return () => clearTimeout(t);
    }
    prevScore.current = liveScore;
  }, [liveScore, free]);

  const undo = () => {
    if (!history.length) return;
    blip(440, 0.06, 'triangle', muted);
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setLook(prev);
    setFaceTick(t => t + 1);
  };

  const clearStation = () => {
    const next = { ...look };
    if (station === 'hair') next.hair = null;
    else if (station === 'makeup') next.makeup = null;
    else if (station === 'nails') next.nails = null;
    else next.acc = null;
    applyLook(next, true);
  };

  const finish = () => {
    if (free) {
      onDone({ look, score: 0, free: true });
      return;
    }
    const sc = scoreLook(look, customer.want, difficulty);
    blip(sc >= 60 ? 880 : 220, 0.12, sc >= 60 ? 'sine' : 'sawtooth', muted);
    setToast(sc >= 80 ? 'Love it! +' + sc : sc >= 50 ? 'Nice! +' + sc : 'Hmm\u2026 +' + sc);
    setTimeout(() => onDone({ look, score: sc }), 780);
  };

  let options = HAIR;
  if (station === 'makeup') options = MAKEUP;
  else if (station === 'nails') options = NAILS;
  else if (station === 'acc') options = ACC;

  const selectedId = station === 'hair' ? (look.hair && look.hair.style)
    : station === 'makeup' ? look.makeup
    : station === 'nails' ? look.nails
    : look.acc;

  const have = productTags(look);
  const filled = [look.hair, look.makeup, look.nails, look.acc].filter(Boolean).length;
  const matches = customer && customer.want ? matchCount(look, customer.want) : 0;
  const wantLen = customer && customer.want ? customer.want.length : 1;

  return (
    <div className="play">
      <div className="topbar">
        <button className="btn btn-ghost" style={{ padding: '8px 12px', fontSize: 13 }} onClick={onBack}>Menu</button>
        <span>{progressLabel || (free ? 'Free Style' : customer.name)}</span>
        <span
          className="score-live"
          style={scoreBump ? { transform: 'scale(1.2)' } : undefined}
        >{!free ? liveScore : ''}</span>
      </div>
      {!free && customer && (
        <div className="cust-card">
          <div className="cust-name">{customer.name} wants\u2026</div>
          <div className="chips">
            {customer.want.map(w => (
              <span key={w} className={'chip' + (have.includes(w) ? ' ok' : '')}>
                {have.includes(w) ? '\u2713 ' : ''}{chipLabel(w)}
              </span>
            ))}
          </div>
          <div className="match-bar"><i style={{ width: (matches / wantLen * 100) + '%' }} /></div>
        </div>
      )}
      <div className="preview">
        <div className="mirror-frame" />
        <div className="salon-desk" />
        <FacePreview
          key={faceTick}
          look={look}
          skinId={customer && customer.skin}
          shirtId={customer && customer.shirt}
          eyeColor={customer && customer.eyes}
        />
      </div>
      <div className="stations">
        {STATIONS.map(s => {
          const has = s.id === 'hair' ? look.hair : s.id === 'makeup' ? look.makeup : s.id === 'nails' ? look.nails : look.acc;
          return (
            <button
              key={s.id}
              className={(station === s.id ? 'on ' : '') + (has ? 'filled' : '')}
              onClick={() => { setStation(s.id); blip(400, 0.04, 'triangle', muted); }}
            >{s.label}</button>
          );
        })}
      </div>
      {station === 'hair' && (
        <div className="colors">
          {Object.keys(COLORS).map(c => (
            <div
              key={c}
              className={'color-dot' + (hairColor === c ? ' on' : '')}
              style={{ background: COLORS[c] }}
              onClick={() => { setHairColor(c); blip(520, 0.05, 'triangle', muted); }}
            />
          ))}
        </div>
      )}
      <div className="picker">
        {options.map(o => (
          <button
            key={o.id}
            className={'pick' + (selectedId === o.id ? ' on' : '')}
            onClick={() => pick(station, o.id)}
          >
            {station === 'hair' && <div className="sw" style={{ background: COLORS[hairColor] }} />}
            {station === 'makeup' && <div className="sw" style={{ background: o.lips || '#F8BBD0' }} />}
            {station === 'nails' && <div className="sw" style={{ background: o.color }} />}
            {station === 'acc' && <span style={{ fontSize: 22 }}>{o.emoji}</span>}
            <span>{o.name}</span>
          </button>
        ))}
      </div>
      <div className="actions">
        <button className="btn btn-ghost" onClick={undo} disabled={!history.length}>Undo</button>
        <button className="btn btn-ghost" onClick={clearStation}>Clear</button>
        <button className="btn" onClick={finish} disabled={filled === 0}>{free ? 'Save look' : 'Done!'}</button>
      </div>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function OpenSalon({ level, muted, onBack }) {
  const cfg = LEVELS[level];
  const [queue] = useState(() => {
    const list = [...CUSTOMERS];
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list.slice(0, cfg.n);
  });
  const [idx, setIdx] = useState(0);
  const [total, setTotal] = useState(0);
  const [phase, setPhase] = useState('design');
  const [lastScore, setLastScore] = useState(0);
  const [newBest, setNewBest] = useState(false);

  const customer = queue[idx];

  const onDone = ({ score }) => {
    const t = total + score;
    setTotal(t);
    setLastScore(score);
    if (idx + 1 >= queue.length) {
      setNewBest(saveBest(level, t));
      setPhase('over');
      blip(1040, 0.15, 'sine', muted);
    } else {
      setPhase('result');
      setTimeout(() => { setIdx(i => i + 1); setPhase('design'); }, 900);
    }
  };

  if (phase === 'over') {
    return (
      <div className="overlay">
        {total >= 200 && <Confetti count={36} />}
        <div className="card">
          <div className="menu-hero">{newBest ? '\uD83C\uDFC6' : '\uD83D\uDC87'}</div>
          <div className="title">Shift done!</div>
          <div className="result-total">{total}</div>
          {newBest && <div className="new-best">New Best!</div>}
          <div className="sub">You styled {queue.length} customers on {cfg.label}</div>
          <div className="row">
            <button className="btn" onClick={onBack}>Menu</button>
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'result') {
    return (
      <div className="overlay">
        {lastScore >= 80 && <Confetti count={22} />}
        <div className="card">
          <div className="result-emoji">{lastScore >= 80 ? '\uD83D\uDC96' : lastScore >= 50 ? '\uD83D\uDC4D' : '\uD83D\uDE0A'}</div>
          <div className="result-score">+{lastScore}</div>
          <div className="sub">Total {total} \u00B7 Next customer\u2026</div>
        </div>
      </div>
    );
  }

  return (
    <DesignScreen
      customer={customer}
      difficulty={level}
      free={false}
      muted={muted}
      onDone={onDone}
      onBack={onBack}
      progressLabel={'Customer ' + (idx + 1) + '/' + queue.length}
      key={customer.id + '-' + idx}
    />
  );
}

function FreeStyle({ muted, onBack }) {
  const [cust, setCust] = useState(CUSTOMERS[0]);
  const [picking, setPicking] = useState(true);
  const [savedToast, setSavedToast] = useState(false);

  if (picking) {
    return (
      <div className="overlay">
        <div className="card">
          <div className="title" style={{ fontSize: 28 }}>Pick a face</div>
          <div className="sub">Who gets a free makeover?</div>
          <div className="row" style={{ marginTop: 6 }}>
            {CUSTOMERS.map(c => (
              <button
                key={c.id}
                className="btn btn-ghost face-pick"
                style={{ fontSize: 13, padding: '10px 12px', minWidth: 76 }}
                onClick={() => { setCust(c); setPicking(false); blip(660, 0.07, 'sine', muted); }}
              >
                <div className="skin-dot" style={{
                  background: SKINS[c.skin] || SKINS.light,
                  boxShadow: 'inset 0 -8px 0 ' + ((SHIRTS[c.shirt] || SHIRTS.coral)[0]),
                }} />
                {c.name}
              </button>
            ))}
          </div>
          <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={onBack}>Back</button>
        </div>
      </div>
    );
  }

  return (
    <>
      <DesignScreen
        customer={cust}
        free
        muted={muted}
        onBack={onBack}
        onDone={({ look }) => {
          const g = loadGallery();
          g.push({
            t: Date.now(), look, face: cust.id, skin: cust.skin, name: cust.name,
            shirt: cust.shirt, eyes: cust.eyes,
          });
          saveGallery(g);
          blip(880, 0.1, 'sine', muted);
          setSavedToast(true);
          setTimeout(() => setSavedToast(false), 1200);
        }}
      />
      {savedToast && <div className="toast">Saved to gallery!</div>}
    </>
  );
}

function Gallery({ onBack }) {
  const [items, setItems] = useState(loadGallery);

  const remove = (i) => {
    const next = items.filter((_, idx) => idx !== i);
    setItems(next);
    saveGallery(next);
  };

  return (
    <div className="overlay">
      <div className="card" style={{ width: 'min(440px, 96vw)' }}>
        <div className="title" style={{ fontSize: 28 }}>Gallery</div>
        <div className="sub">{items.length ? 'Your saved looks' : 'No saved looks yet \u2014 try Free Style!'}</div>
        <div className="gallery-grid">
          {items.slice().reverse().map((it, revIdx) => {
            const i = items.length - 1 - revIdx;
            return (
              <div key={it.t + '-' + i} className="gallery-item">
                <button className="del" onClick={() => remove(i)} aria-label="Delete">\u00D7</button>
                <div className="mini">
                  <FacePreview
                    look={it.look || {}}
                    skinId={it.skin}
                    shirtId={it.shirt}
                    eyeColor={it.eyes}
                  />
                </div>
                <div style={{ fontSize: 12, fontWeight: 700, marginTop: 4 }}>{it.name || 'Look'}</div>
              </div>
            );
          })}
        </div>
        <button className="btn btn-ghost" onClick={onBack}>Back</button>
      </div>
    </div>
  );
}

function Tutorial({ onClose }) {
  return (
    <div className="overlay" style={{ zIndex: 30, background: 'rgba(0,0,0,0.55)' }}>
      <div className="card">
        <div className="title" style={{ fontSize: 26 }}>How to play</div>
        <div className="sub" style={{ textAlign: 'left' }}>
          <p style={{ marginBottom: 8 }}>1. Read the pink chips \u2014 that is what the customer wants.</p>
          <p style={{ marginBottom: 8 }}>2. Pick Hair, Makeup, Nails, and Extra. Match the chips!</p>
          <p style={{ marginBottom: 8 }}>3. Chips turn green when you match. Tap Done when ready.</p>
          <p>Easy needs fewer matches. Hard wants a full look.</p>
        </div>
        <button className="btn" onClick={onClose}>Let's go!</button>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('menu');
  const [level, setLevel] = useState('easy');
  const [muted, setMuted] = useState(() => localStorage.getItem('salon_muted') === '1');
  const [showTut, setShowTut] = useState(() => !localStorage.getItem('salon_tutorial'));
  const [tick, setTick] = useState(0);
  const bests = {
    easy: loadBest('easy'),
    med: loadBest('med'),
    hard: loadBest('hard'),
  };
  const galleryCount = loadGallery().length;

  const toggleMute = () => {
    const m = !muted;
    setMuted(m);
    try { localStorage.setItem('salon_muted', m ? '1' : '0'); } catch (e) {}
  };

  const goMenu = () => { setScreen('menu'); setTick(t => t + 1); };

  if (screen === 'salon') {
    return <OpenSalon level={level} muted={muted} onBack={goMenu} key={'s-' + level + '-' + tick} />;
  }
  if (screen === 'free') {
    return <FreeStyle muted={muted} onBack={goMenu} />;
  }
  if (screen === 'gallery') {
    return <Gallery onBack={goMenu} />;
  }

  return (
    <>
      <BgOrbs />
      <div className="overlay">
        {showTut && (
          <Tutorial onClose={() => {
            try { localStorage.setItem('salon_tutorial', '1'); } catch (e) {}
            setShowTut(false);
          }} />
        )}
        <div className="card">
          <div className="menu-hero">{'\uD83D\uDC87'}</div>
          <div className="title">Beauty Salon</div>
          <div className="sub">Amber styles hair, makeup & nails for happy customers!</div>
          <div className="section-label">Open Salon</div>
          <div className="row">
            {Object.keys(LEVELS).map(k => (
              <button
                key={k}
                className="btn level-btn"
                onClick={() => { setLevel(k); setScreen('salon'); blip(720, 0.08, 'sine', muted); }}
              >
                {LEVELS[k].label}
                <div className="bests">Best {bests[k] || '\u2014'}</div>
              </button>
            ))}
          </div>
          <div className="row" style={{ marginTop: 14 }}>
            <button className="btn btn-sec" onClick={() => { setScreen('free'); blip(600, 0.07, 'sine', muted); }}>Free Style</button>
            <button className="btn btn-ghost" onClick={() => setScreen('gallery')}>
              Gallery{galleryCount ? ' (' + galleryCount + ')' : ''}
            </button>
          </div>
          <div className="row" style={{ marginTop: 8 }}>
            <button className="btn btn-ghost" onClick={toggleMute}>{muted ? '\uD83D\uDD07' : '\uD83D\uDD0A'}</button>
            <button className="btn btn-ghost" onClick={() => setShowTut(true)}>?</button>
          </div>
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
<script src="playtime.js?v=2"></script>
</body>
</html>
