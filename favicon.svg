<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Amber's Games">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#152548"/>
      <stop offset="55%" stop-color="#0b1530"/>
      <stop offset="100%" stop-color="#070f22"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a7a"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffd180"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Subtle glow orbs -->
  <circle cx="28" cy="30" r="34" fill="#ff8a65" opacity="0.18"/>
  <circle cx="102" cy="24" r="28" fill="#42a5f5" opacity="0.16"/>
  <circle cx="96" cy="100" r="30" fill="#ab47bc" opacity="0.12"/>

  <!-- Gamepad body -->
  <g filter="url(#soft)">
    <path d="M28 58
             C28 46 38 38 52 38
             H76
             C90 38 100 46 100 58
             V78
             C100 92 90 100 76 100
             H52
             C38 100 28 92 28 78
             Z" fill="url(#pad)"/>
    <!-- Side grips -->
    <ellipse cx="30" cy="78" rx="14" ry="18" fill="url(#pad)"/>
    <ellipse cx="98" cy="78" rx="14" ry="18" fill="url(#pad)"/>
  </g>

  <!-- D-pad -->
  <g fill="#0b1530" opacity="0.92">
    <rect x="40" y="62" width="8" height="22" rx="2"/>
    <rect x="33" y="69" width="22" height="8" rx="2"/>
  </g>
  <circle cx="44" cy="73" r="2.2" fill="#ffe082" opacity="0.85"/>

  <!-- AB buttons -->
  <circle cx="82" cy="66" r="6.5" fill="#5ffbf1"/>
  <circle cx="94" cy="76" r="6.5" fill="#ffd180"/>
  <text x="82" y="69.5" text-anchor="middle" font-size="8" font-family="system-ui,sans-serif" font-weight="800" fill="#0b1530">A</text>
  <text x="94" y="79.5" text-anchor="middle" font-size="8" font-family="system-ui,sans-serif" font-weight="800" fill="#0b1530">B</text>

  <!-- Start/select dots -->
  <circle cx="58" cy="84" r="2" fill="#0b1530" opacity="0.55"/>
  <circle cx="66" cy="84" r="2" fill="#0b1530" opacity="0.55"/>

  <!-- Tiny star sparkle (Amber flair) -->
  <g fill="url(#gold)">
    <polygon points="64,18 66.2,23.5 72,23.8 67.4,27.4 68.8,33 64,29.8 59.2,33 60.6,27.4 56,23.8 61.8,23.5"/>
  </g>
</svg>
