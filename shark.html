<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amber's Shark Hunt">
shark.html
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Eat, grow, dash, and hold the apex as Amber's shark!">
<title>Amber's Shark Hunt</title>
<style>
  :root {
    --bg: #061526;
    --ink: #f4f6ff;
    --coral: #ff8a65;
    --cyan: #5ffbf1;
    --blue: #42a5f5;
    --gold: #ffd700;
    --danger: #ff6e6e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { width: 100%; height: 100%; position: relative; overflow: hidden; }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding:
      max(16px, env(safe-area-inset-top, 16px))
      max(16px, env(safe-area-inset-right, 16px))
      max(16px, env(safe-area-inset-bottom, 16px))
      max(16px, env(safe-area-inset-left, 16px));
    background: rgba(2, 12, 24, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .panel {
    width: min(400px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: linear-gradient(165deg, rgba(10, 60, 80, 0.95), rgba(6, 21, 38, 0.98));
    border: 1px solid rgba(95, 251, 241, 0.25);
    border-radius: 24px; padding: 22px 18px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(95,251,241,0.08);
  }
  .brand {
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--cyan); opacity: 0.85; margin-bottom: 4px;
  }
  .title {
    font-size: clamp(28px, 7.5vw, 46px); font-weight: 900;
    background: linear-gradient(135deg, #5ffbf1, #42a5f5, #ff8a65);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .sub { opacity: 0.88; font-size: 14px; line-height: 1.5; margin-bottom: 14px; font-weight: 600; }
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px;
    font-size: 11px; font-weight: 700; opacity: 0.82; margin: -4px 0 14px; line-height: 1.4;
  }
  .legend span { white-space: nowrap; }
  .levels { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .lvl {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; min-height: 68px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06); color: #fff;
    font-family: inherit; cursor: pointer; text-align: left;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
  }
  .lvl:active { transform: scale(0.98); }
  .lvl .ico {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 24px;
    background: rgba(0,0,0,0.25);
  }
  .lvl.easy { border-color: rgba(76,175,80,0.45); background: linear-gradient(105deg, rgba(76,175,80,0.28), transparent); }
  .lvl.med { border-color: rgba(95,251,241,0.4); background: linear-gradient(105deg, rgba(95,251,241,0.2), transparent); }
  .lvl.hard { border-color: rgba(255,110,110,0.45); background: linear-gradient(105deg, rgba(255,110,110,0.22), transparent); }
  .lvl .info { flex: 1; min-width: 0; }
  .lvl .nm { font-size: 16px; font-weight: 800; }
  .lvl .ds { font-size: 11px; opacity: 0.75; font-weight: 600; margin-top: 2px; }
  .lvl .best { font-size: 12px; font-weight: 800; color: var(--gold); white-space: nowrap; text-align: right; }
  .lvl .best small { display: block; font-size: 10px; color: var(--cyan); font-weight: 700; margin-top: 2px; }
  .btn {
    border: 0; border-radius: 14px; padding: 12px 20px; margin: 4px;
    background: linear-gradient(135deg, #5ffbf1, #42a5f5);
    font-weight: 900; color: #062032; cursor: pointer; font-family: inherit;
    touch-action: manipulation; min-height: 44px;
  }
  .btn.ghost {
    background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; gap: 8px;
    padding: 12px 14px;
    padding-top: max(12px, env(safe-area-inset-top, 12px));
    font-weight: 900; text-shadow: 0 2px 8px #000; pointer-events: none;
  }
  .hud .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hud .btns { display: flex; gap: 6px; pointer-events: auto; }
  .score { color: var(--cyan); font-size: 22px; }
  .meta { font-size: 12px; opacity: 0.88; font-weight: 700; max-width: min(58vw, 320px); }
  .lives { color: var(--danger); letter-spacing: 3px; text-align: right; font-size: 16px; }
  .combo-chip {
    display: none; margin-top: 4px; padding: 3px 10px; border-radius: 999px;
    background: rgba(255,215,0,0.2); border: 1px solid rgba(255,215,0,0.45);
    color: var(--gold); font-size: 12px; font-weight: 900; width: fit-content;
  }
  .combo-chip.on { display: inline-block; }
  .combo-chip.hot { background: rgba(255,110,110,0.28); border-color: rgba(255,110,110,0.55); color: #ffcdd2; }
  .icon {
    background: rgba(0,0,0,0.5); color: #fff;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 10px;
    padding: 8px 12px; cursor: pointer; font-size: 14px; min-height: 40px;
    font-family: inherit; touch-action: manipulation;
  }
  .hint {
    position: absolute; left: 0; right: 0; z-index: 4;
    bottom: max(12px, env(safe-area-inset-bottom, 12px));
    text-align: center; font-size: 11px; opacity: 0.78; font-weight: 600;
    padding: 0 80px 0 12px; pointer-events: none;
    transition: opacity 0.6s;
  }
  .hint.hide { opacity: 0; }
  .toast {
    position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%);
    z-index: 15; font-weight: 900; font-size: 17px; pointer-events: none;
    text-shadow: 0 2px 10px #000; animation: pop 0.9s ease-out forwards;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -40%) scale(0.85); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
  }
  .fab {
    position: absolute; z-index: 6;
    bottom: max(64px, calc(env(safe-area-inset-bottom, 0px) + 52px));
    width: 72px; height: 72px; border-radius: 999px;
    border: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    font-size: 13px; font-weight: 900; cursor: pointer; font-family: inherit;
    line-height: 1.15; transition: transform 0.1s, filter 0.1s;
    touch-action: manipulation;
    background:
      conic-gradient(from -90deg, rgba(255,255,255,0.55) calc(var(--ready, 1) * 1%), transparent 0),
      linear-gradient(135deg, #888, #555);
    color: #fff;
  }
  .fab span { display: block; position: relative; z-index: 1; }
  .fab:disabled { opacity: 0.55; filter: grayscale(0.4); }
  .fab:active:not(:disabled) { transform: scale(0.9); }
  .fab.bite {
    right: max(96px, calc(env(safe-area-inset-right, 0px) + 88px));
    background:
      conic-gradient(from -90deg, #ffe0b2 calc(var(--ready, 1) * 1%), transparent 0),
      linear-gradient(135deg, #ff8a65, #ff3d55);
    color: #fff;
  }
  .fab.dash {
    right: max(16px, env(safe-area-inset-right, 16px));
    background:
      conic-gradient(from -90deg, #e0ffff calc(var(--ready, 1) * 1%), transparent 0),
      linear-gradient(135deg, #5ffbf1, #42a5f5);
    color: #062032;
  }
  .bar-wrap {
    position: absolute; left: 50%; z-index: 5;
    top: max(52px, calc(env(safe-area-inset-top, 0px) + 42px));
    transform: translateX(-50%);
    width: min(280px, 62vw); pointer-events: none;
  }
  .bar-label {
    font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
    opacity: 0.8; text-transform: uppercase; text-align: center; margin-bottom: 3px;
    text-shadow: 0 1px 4px #000;
  }
  .bar {
    height: 8px; width: 100%;
    background: rgba(255,255,255,0.15); border-radius: 999px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
  }
  .bar i {
    display: block; height: 100%; width: 0%;
    background: #4caf50; transition: width 0.08s linear;
  }
  .bar.apex i { background: linear-gradient(90deg, #ffd700, #fff8e1, #ffd700); }
  .bar.apex { box-shadow: 0 0 12px rgba(255,215,0,0.45); }
  .combo-bar {
    margin-top: 4px; height: 4px; width: 100%;
    background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden;
  }
  .combo-bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #5ffbf1, #ffd700); transition: width 0.06s linear;
  }
  .mission {
    position: absolute; left: 50%; z-index: 5;
    top: max(84px, calc(env(safe-area-inset-top, 0px) + 74px));
    transform: translateX(-50%);
    font-size: 11px; font-weight: 800; opacity: 0.85;
    text-shadow: 0 1px 6px #000; pointer-events: none; white-space: nowrap;
    color: #e0f7fa;
  }
  .result-title {
    font-size: clamp(28px, 7vw, 40px); font-weight: 900; margin-bottom: 8px;
  }
  .result-title.win {
    background: linear-gradient(135deg, #ffd700, #5ffbf1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stats { font-size: 13px; font-weight: 700; opacity: 0.9; margin: 12px 0 16px; line-height: 1.65; }
  .stats b { color: var(--cyan); }
  .badge-new {
    display: inline-block; margin-bottom: 8px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,215,0,0.18); border: 1px solid rgba(255,215,0,0.4);
    color: var(--gold); font-size: 12px; font-weight: 900;
  }
  @media (min-width: 768px) {
    .panel { width: min(440px, 88vw); padding: 28px; }
    .fab { width: 80px; height: 80px; font-size: 14px; }
    .lvl { min-height: 80px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fab:active { transform: none; }
    .toast { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
window.addEventListener('error', function(e){ if(window.AmberHardening && AmberHardening.__amberErrorInstalled) return; try{ var d=document.createElement('div'); d.setAttribute('role','alert'); d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;'; d.innerHTML='<div style="font-size:48px;margin-bottom:16px">🦊</div><div style="font-size:18px;margin-bottom:24px">Oops! Reload and try again.</div><button onclick="location.reload()" style="font-size:16px;padding:12px 24px;border:none;border-radius:8px;background:#f5a623;color:#1a1a2e;cursor:pointer;font-weight:bold;">Reload</button>'; document.body.appendChild(d); }catch(_){} });
(function () {
  const A = document.getElementById('app');
  const C = { a: '#ff8a65', d: '#ff6e6e', g: '#4caf50', b: '#42a5f5', y: '#ffd700', q: '#5ffbf1' };
  const DIFF = {
    easy: { name: 'Easy', life: 5, spd: 0.82, magnet: 1.35, flee: 0.55, chase: 0.35, label: 'Chill reef · snacks pull in' },
    med:  { name: 'Medium', life: 3, spd: 1.0,  magnet: 1.0,  flee: 0.85, chase: 0.55, label: 'Open sea · fair hunt' },
    hard: { name: 'Hard', life: 2, spd: 1.25, magnet: 0.7,  flee: 1.15, chase: 0.85, label: 'Abyss · prey flees hard' },
  };
  const LVLS = ['easy', 'med', 'hard'];
  const SIZE_NAMES = ['', 'Pup', 'Hunter', 'Glider', 'Reef King', 'Apex', 'Legend'];
  const RELIC_TIP = {
    '\u2764\uFE0F': '+1 heart',
    '\u2B50': 'Shield!',
    '\uD83C\uDF00': 'Vortex!',
    '\uD83D\uDC8E': 'Pearl!',
  };

  let muted = false; try { muted = localStorage.getItem('shark_muted') === '1'; } catch(e){}
  let audio = null;
  let stopGame = () => {};

  const $ = (id) => document.getElementById(id);
  const R = (a, b) => a + Math.random() * (b - a);
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const P = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const angDiff = (a, b) => {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  };

  function migrateBest(lvl) {
    const n = parseInt(localStorage.getItem('shark_best_' + lvl) || '0', 10);
    const legacy = parseInt(localStorage.getItem('wild_best_shark_' + lvl) || '0', 10);
    return Math.max(n || 0, legacy || 0);
  }
  function getBest(lvl) { return migrateBest(lvl); }
  function setBest(lvl, score) {
    const next = Math.max(getBest(lvl), score | 0);
    try {
      localStorage.setItem('shark_best_' + lvl, String(next));
      localStorage.setItem('wild_best_shark_' + lvl, String(next));
    } catch (e) {}
    return next;
  }
  function getBestSize(lvl) {
    return parseInt(localStorage.getItem('shark_bestsize_' + lvl) || '0', 10) || 0;
  }
  function setBestSize(lvl, size) {
    const next = Math.max(getBestSize(lvl), size | 0);
    try { localStorage.setItem('shark_bestsize_' + lvl, String(next)); } catch (e) {}
    return next;
  }
  function getWins(lvl) {
    return parseInt(localStorage.getItem('shark_wins_' + lvl) || '0', 10) || 0;
  }
  function addWin(lvl) {
    const n = getWins(lvl) + 1;
    try { localStorage.setItem('shark_wins_' + lvl, String(n)); } catch (e) {}
    return n;
  }
  function hearts(n, m) {
    return '\u2665'.repeat(Math.max(0, n)) +
      '<span style="opacity:.28">' + '\u2665'.repeat(Math.max(0, m - n)) + '</span>';
  }
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {}
  }

  function initAudio() {
    if (!audio) try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
  }
  function tone(a, b, d, type) {
    if (muted || !audio) return;
    b = b == null ? a : b; d = d || 0.1; type = type || 'sine';
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(a, t);
    if (a !== b) o.frequency.exponentialRampToValueAtTime(Math.max(20, b), t + d);
    g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d + 0.02);
  }
  function fx(k) {
    if (k === 'bad') tone(180, 45, 0.22, 'square');
    else if (k === 'bite') tone(320, 70, 0.16, 'square');
    else if (k === 'dash') tone(180, 1100, 0.2, 'sawtooth');
    else if (k === 'grow') [523, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.1), i * 55));
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.14), i * 90));
    else if (k === 'nibble') tone(520, 380, 0.06, 'triangle');
    else if (k === 'near') tone(880, 1320, 0.08, 'sine');
    else if (k === 'combo') [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, f, 0.07), i * 40));
    else [660, 880].forEach((f, i) => setTimeout(() => tone(f, f, 0.08), i * 45));
  }
  function toast(text, color) {
    const el = document.createElement('div');
    el.className = 'toast'; el.style.color = color || C.q; el.textContent = text;
    A.appendChild(el);
    setTimeout(() => { try { el.remove(); } catch (e) {} }, 950);
  }

  function showMenu() {
    stopGame();
    const rows = LVLS.map(l => {
      const d = DIFF[l];
      const b = getBest(l);
      const bs = getBestSize(l);
      const w = getWins(l);
      return `<button type="button" class="lvl ${l}" data-l="${l}">
        <div class="ico">\uD83E\uDD88</div>
        <div class="info">
          <div class="nm">${d.name}</div>
          <div class="ds">${d.label}${bs ? ' · size ' + bs : ''}</div>
        </div>
        <div class="best">Best ${b || '\u2014'}${w ? '<small>' + w + ' apex win' + (w > 1 ? 's' : '') + '</small>' : ''}</div>
      </button>`;
    }).join('');
    A.innerHTML = `<div class="overlay"><div class="panel">
      <div class="brand">Amber's Arcade</div>
      <div class="title">Shark Hunt</div>
      <div class="sub">Swim into snacks, chomp for combos, dash past danger, then hold <b>APEX</b> at size 5!</div>
      <div class="legend">
        <span>\uD83D\uDC1F snack (cyan ring)</span>
        <span>\uD83E\uDD88 danger (red glow)</span>
        <span>\u26A1 double-tap dash</span>
      </div>
      <div class="levels">${rows}</div>
      <div class="btn-row">
        <button type="button" class="btn ghost" id="muteBtn">${muted ? '\uD83D\uDD07 Muted' : '\uD83D\uDD0A Sound'}</button>
        <button type="button" class="btn ghost" id="helpBtn">How to play</button>
        <button type="button" class="btn ghost" id="homeBtn">Games home</button>
      </div>
    </div></div>`;
    A.querySelectorAll('[data-l]').forEach(btn => {
      btn.onclick = () => { initAudio(); startLevel(btn.getAttribute('data-l')); };
    });
    $('muteBtn').onclick = () => {
      muted = !muted;
      try { localStorage.setItem('shark_muted', muted ? '1' : '0'); } catch (e) {}
      showMenu();
    };
    $('helpBtn').onclick = () => showHelp(showMenu);
    $('homeBtn').onclick = () => { location.href = 'portal.html'; };
  }

  function showHelp(onClose) {
    A.innerHTML = `<div class="overlay"><div class="panel">
      <div class="title" style="font-size:28px">How to hunt</div>
      <div class="sub" style="text-align:left">
        <b>Drag</b> to swim — snacks with a cyan ring are safe to eat.<br>
        <b>Swim into</b> them, or tap <b>Bite</b> for a forward chomp + bonus.<br>
        <b>Dash</b> (button or double-tap) to zip past bigger sharks.<br>
        Near-miss a big fish while dashing for extra points!<br>
        Grow to <b>size 5</b>, hold the gold <b>APEX</b> bar for <b>8 seconds</b> to win.
      </div>
      <button type="button" class="btn" id="okHelp">Got it!</button>
    </div></div>`;
    $('okHelp').onclick = () => {
      try { localStorage.setItem('shark_tutorial', '1'); } catch (e) {}
      onClose();
    };
  }

  function fmtTime(sec) {
    const s = Math.max(0, sec | 0);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  function showOver(lvl, result) {
    stopGame();
    const prev = getBest(lvl);
    const saved = setBest(lvl, result.score);
    setBestSize(lvl, result.size || 1);
    let wins = getWins(lvl);
    if (result.won) wins = addWin(lvl);
    const isBest = result.score > 0 && result.score >= saved && result.score > prev;
    const title = result.won ? 'Apex Champion!' : (isBest ? 'New Record!' : (result.reason || 'Hunt over'));
    A.innerHTML = `<div class="overlay"><div class="panel">
      <div class="result-title ${result.won ? 'win' : ''}">${title}</div>
      ${isBest ? '<div class="badge-new">New best score!</div>' : ''}
      <div class="stats">
        Score <b>${result.score | 0}</b><br>
        Size <b>${result.size || 1}</b> ${SIZE_NAMES[result.size || 1] ? '(' + SIZE_NAMES[result.size || 1] + ')' : ''}<br>
        Fish eaten <b>${result.eaten || 0}</b> · Near-misses <b>${result.near || 0}</b><br>
        Best chain <b>x${result.chain || 0}</b> · Time <b>${fmtTime(result.time || 0)}</b><br>
        Best ${DIFF[lvl].name}: <b>${getBest(lvl)}</b>${wins ? ' · Apex wins <b>' + wins + '</b>' : ''}
      </div>
      <div class="btn-row">
        <button type="button" class="btn" id="again">Hunt again</button>
        <button type="button" class="btn ghost" id="menu">Menu</button>
        <button type="button" class="btn ghost" id="home">Games home</button>
      </div>
    </div></div>`;
    if (result.won) fx('win');
    $('again').onclick = () => { initAudio(); startLevel(lvl); };
    $('menu').onclick = showMenu;
    $('home').onclick = () => { location.href = 'portal.html'; };
  }

  function startLevel(lvl) {
    const cfg = DIFF[lvl];
    if (!cfg) return;
    if (localStorage.getItem('shark_tutorial') !== '1') {
      showHelp(() => beginHunt(lvl));
      return;
    }
    beginHunt(lvl);
  }

  function beginHunt(lvl) {
    const cfg = DIFF[lvl];
    let raf = 0, paused = false, last = 0, w = 0, h = 0, ended = false;
    let lastTap = 0;

    A.innerHTML =
      '<canvas id="cv"></canvas>' +
      '<div class="hud" id="hud">' +
        '<div class="left">' +
          '<div class="score" id="sc">0</div>' +
          '<div class="meta" id="meta"></div>' +
          '<div class="combo-chip" id="comboChip">x2 combo</div>' +
        '</div>' +
        '<div class="right">' +
          '<div class="lives" id="lives"></div>' +
          '<div class="btns">' +
            '<button type="button" class="icon" id="mu"></button>' +
            '<button type="button" class="icon" id="pa">\u23F8</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="bar-wrap">' +
        '<div class="bar-label" id="barLabel">GROW</div>' +
        '<div class="bar" id="growbar"><i id="apex"></i></div>' +
        '<div class="combo-bar"><i id="comboFill"></i></div>' +
      '</div>' +
      '<div class="mission" id="mission"></div>' +
      '<button type="button" class="fab bite" id="bite"><span>\uD83D\uDC1F<br>Bite</span></button>' +
      '<button type="button" class="fab dash" id="dash"><span>\u26A1<br>Dash</span></button>' +
      '<div class="hint" id="hint">Drag to swim · cyan ring = snack · double-tap to dash · hold APEX at size 5</div>';

    const cv = $('cv');
    const ctx = cv.getContext('2d');
    const elSc = $('sc'), elMeta = $('meta'), elLives = $('lives');
    const elCombo = $('comboChip'), elHint = $('hint'), elMission = $('mission');
    const elApex = $('apex'), elBar = $('growbar'), elLab = $('barLabel');
    const elComboFill = $('comboFill');
    const elBite = $('bite'), elDash = $('dash');
    const elMu = $('mu');

    elMu.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
    elMu.onclick = () => {
      muted = !muted;
      try { localStorage.setItem('shark_muted', muted ? '1' : '0'); } catch (e) {}
      elMu.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
    };
    $('pa').onclick = () => {
      if (ended || paused) return;
      paused = true;
      const o = document.createElement('div');
      o.className = 'overlay';
      o.innerHTML = '<div class="panel"><div class="title" style="font-size:32px">Paused</div>' +
        '<div class="btn-row"><button type="button" class="btn" id="res">Resume</button>' +
        '<button type="button" class="btn ghost" id="quit">Menu</button></div></div>';
      A.appendChild(o);
      $('res').onclick = () => {
        o.remove(); paused = false; last = performance.now();
        raf = requestAnimationFrame(loop);
      };
      $('quit').onclick = () => { o.remove(); stopGame(); showMenu(); };
    };

    const fish = [
      ['\uD83D\uDC1F', 1, 10, 16, 1.0],
      ['\uD83E\uDD90', 1, 14, 16, 1.15],
      ['\uD83D\uDC20', 2, 28, 22, 1.0],
      ['\uD83E\uDD91', 3, 45, 28, 0.8],
      ['\uD83E\uDD88', 4, 75, 36, 0.7],
      ['\uD83D\uDC0B', 5, 130, 48, 0.52],
    ];
    const s = {
      x: 0, y: 0, tx: 0, ty: 0, face: 0, size: 1, xp: 0, score: 0, life: cfg.life,
      combo: 0, comboT: 0, bestChain: 0, bite: 0, cd: 0, dash: 0, dashCD: 0,
      shield: 1.5, t: 0, next: 0, power: 5.2, objs: [], parts: [], bubbles: [],
      float: [], frenzy: 0, goal: 0, biome: 'coral reef', sonar: 0, shake: 0,
      eaten: 0, near: 0, trail: [], dangerNear: 0, hintT: 11, slow: 0,
      lastComboMark: 0,
    };

    function resize() {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const r = cv.getBoundingClientRect();
      w = r.width; h = r.height;
      cv.width = Math.floor(w * d); cv.height = Math.floor(h * d);
      ctx.setTransform(d, 0, 0, d, 0, 0);
      if (!s.x) { s.x = w * 0.5; s.y = h * 0.52; s.tx = s.x; s.ty = s.y; }
    }
    resize();
    window.addEventListener('resize', resize);

    function pushFish(p, left, i, gold) {
      const dir = left ? 1 : -1;
      const spd = R(48, 100) * cfg.spd * p[4];
      s.objs.push({
        e: gold ? '\u2728' : p[0], n: p[1], p: gold ? 280 : p[2], r: gold ? 24 : p[3],
        x: (left ? -60 : w + 60) + (left ? -i * 24 : i * 24),
        y: R(95, h - 80) + i * 13,
        vx: dir * spd, vy: R(-18, 18), baseVx: dir * spd, baseVy: 0,
        phase: R(0, 7), gold, miss: 0,
      });
    }

    function spawn() {
      const left = Math.random() < 0.5;
      let pool = fish.filter(f => f[1] <= Math.min(6, s.size + 2));
      let p = P(pool);
      if (Math.random() < (0.15 + 0.09 * cfg.spd)) {
        const bp = fish.filter(f => f[1] >= Math.max(2, s.size + 1));
        if (bp.length) p = P(bp);
      }
      if (s.size <= 2 && Math.random() < 0.4) {
        const small = fish.filter(f => f[1] <= s.size);
        if (small.length) p = P(small);
      }
      const gold = Math.random() < 0.05;
      const school = Math.random() < 0.24 && s.size > 1;
      const n = school ? 3 + Math.floor(R(0, 3)) : 1;
      for (let i = 0; i < n; i++) pushFish(p, left, i, gold && i === 0);
    }

    function bootSchool() {
      for (let k = 0; k < 5; k++) {
        const p = fish[Math.random() < 0.7 ? 0 : 1];
        const left = k % 2 === 0;
        pushFish(p, left, k % 3, false);
        s.objs[s.objs.length - 1].x = R(w * 0.15, w * 0.85);
        s.objs[s.objs.length - 1].y = R(h * 0.25, h * 0.75);
      }
    }

    function relic() {
      const e = P(['\u2764\uFE0F', '\u2B50', '\uD83C\uDF00', '\uD83D\uDC8E']);
      s.objs.push({
        relic: 1, e, x: R(80, w - 80), y: R(110, h - 90), r: 22, n: 0, p: 0,
        vx: R(-14, 14), vy: R(-10, 10), baseVx: 0, baseVy: 0, phase: R(0, 6), miss: 0,
      });
    }
    function burst(px, py, col, n) {
      for (let i = 0; i < (n || 12); i++) {
        s.parts.push({ x: px, y: py, vx: R(-170, 170), vy: R(-140, 140), r: R(2, 5), life: 0.55, c: col });
      }
    }
    function doBite() {
      if (s.cd > 0 || ended || paused) return;
      s.bite = 0.34; s.cd = 0.48; fx('bite'); buzz(8);
    }
    function doDash() {
      if (s.dashCD > 0 || ended || paused) return;
      s.dash = 0.5; s.dashCD = 2.7; s.shield = Math.max(s.shield, 0.8);
      fx('dash'); toast('Burst dash!', C.q); buzz([8, 30, 8]);
      for (let i = 0; i < 12; i++) {
        s.bubbles.push({ x: s.x + R(-20, 20), y: s.y + R(-12, 12), r: R(3, 8), vy: R(-70, -20), life: 0.9 });
      }
    }
    elBite.onclick = doBite;
    elDash.onclick = doDash;

    function eat(o, chomp) {
      if (s.comboT <= 0) s.combo = 0;
      s.combo++; s.comboT = 1.8;
      s.bestChain = Math.max(s.bestChain, s.combo);
      s.eaten++;
      if (s.combo === 5 || s.combo === 10 || s.combo === 15) {
        if (s.lastComboMark !== s.combo) {
          s.lastComboMark = s.combo;
          toast(s.combo >= 10 ? 'MEGA COMBO x' + s.combo + '!' : 'Feeding frenzy x' + s.combo + '!', C.y);
          fx('combo'); buzz(20);
        }
      }
      const m = s.combo >= 10 ? 4 : s.combo >= 6 ? 3 : s.combo >= 3 ? 2 : 1;
      const chompBonus = chomp ? 1.4 : 1;
      const pts = Math.floor(o.p * m * chompBonus);
      s.score += pts;
      s.xp += o.n + 1 + (chomp ? 1 : 0);
      s.frenzy = Math.min(1, s.frenzy + (chomp ? 0.13 : 0.08));
      s.float.push({
        x: o.x, y: o.y,
        t: (o.gold ? '\u2728 ' : '+') + pts + (m > 1 ? ' x' + m : ''),
        life: 0.85, c: o.gold ? C.y : (chomp ? C.a : C.q),
      });
      fx(o.gold ? 'grow' : (chomp ? 'bite' : 'nibble'));
      burst(o.x, o.y, o.gold ? C.y : C.q, o.gold ? 22 : (chomp ? 16 : 10));
      if (s.hintT > 0) { s.hintT = 0; if (elHint) elHint.classList.add('hide'); }
      if (s.xp >= s.size * 4 && s.size < 6) {
        s.xp = 0; s.size++; s.shield = 1.7; s.sonar = 1; s.slow = 0.45;
        const name = SIZE_NAMES[s.size] || ('Size ' + s.size);
        toast(name.toUpperCase() + '!', C.g); fx('grow'); buzz([12, 40, 18]);
        if (s.size === 5) setTimeout(() => toast('Hold APEX bar!', C.y), 500);
      }
    }

    function end(result) {
      if (ended) return;
      ended = true;
      cancelAnimationFrame(raf);
      if (result.won) {
        result.score = (result.score | 0) + s.life * 80 + Math.floor(s.bestChain * 15) + s.near * 25;
      }
      result.eaten = s.eaten;
      result.near = s.near;
      result.time = s.t;
      showOver(lvl, result);
    }

    function inBiteCone(ox, oy, reach) {
      const d = Math.hypot(ox - s.x, oy - s.y);
      if (d > reach) return false;
      const a = Math.atan2(oy - s.y, ox - s.x);
      return Math.abs(angDiff(a, s.face)) < 0.95;
    }

    function step(dt, t) {
      if (ended) return;
      if (s.slow > 0) {
        s.slow -= dt;
        dt *= 0.35;
      }
      s.t += dt;
      if (s.hintT > 0) {
        s.hintT -= dt;
        if (s.hintT <= 0 && elHint) elHint.classList.add('hide');
      }
      ['bite', 'cd', 'dash', 'dashCD', 'shield', 'sonar', 'comboT'].forEach(k => {
        if (s[k] > 0) s[k] -= dt;
      });
      if (s.comboT <= 0) { s.combo = 0; s.lastComboMark = 0; }
      if (s.frenzy > 0) s.frenzy -= dt * 0.035;

      const ease = (s.dash > 0 ? 20 : 9.4) * (s.frenzy > 0.5 ? 1.12 : 1);
      s.x += (s.tx - s.x) * Math.min(1, dt * ease);
      s.y += (s.ty - s.y) * Math.min(1, dt * ease);
      s.x = cl(s.x, 42, w - 42);
      s.y = cl(s.y, 90, h - 48);
      const dx = s.tx - s.x, dy = s.ty - s.y;
      if (Math.hypot(dx, dy) > 6) s.face = Math.atan2(dy, dx);

      if (s.dash > 0 || Math.hypot(dx, dy) > 8) {
        s.trail.push({ x: s.x, y: s.y, life: s.dash > 0 ? 0.38 : 0.18, r: 10 + s.size * 2 });
      }
      s.trail.forEach(tr => { tr.life -= dt; });
      s.trail = s.trail.filter(tr => tr.life > 0).slice(-20);

      if (!s.next || s.next < t) {
        spawn();
        s.next = t + R(340, 960) / (cfg.spd * (1 + s.frenzy * 0.5));
      }
      s.power -= dt;
      if (s.power <= 0) { relic(); s.power = R(5.8, 9.2); }

      const sr = 28 + s.size * 7;
      const magnetR = 110 + s.size * 12;
      const fleeR = 150 + s.size * 10;

      s.objs.forEach(o => {
        if (o.dead) return;
        const odx = o.x - s.x, ody = o.y - s.y;
        const dist = Math.hypot(odx, ody) || 1;
        const ux = odx / dist, uy = ody / dist;

        if (o.relic) {
          if (dist < magnetR * 1.1) {
            o.vx += -ux * 70 * cfg.magnet * dt;
            o.vy += -uy * 70 * cfg.magnet * dt;
          }
          o.x += o.vx * dt;
          o.y += o.vy * dt + Math.sin(s.t * 2.2 + o.phase) * 10 * dt;
          o.y = cl(o.y, 86, h - 42);
          return;
        }

        let ax = 0, ay = 0;
        if (o.n <= s.size && dist < magnetR) {
          const pull = (1 - dist / magnetR) * 95 * cfg.magnet;
          ax += -ux * pull;
          ay += -uy * pull;
        } else if (o.n > s.size && dist < fleeR) {
          if (s.dash > 0) {
            ax += ux * 40 * cfg.flee;
            ay += uy * 40 * cfg.flee;
          } else {
            ax += -ux * 55 * cfg.chase;
            ay += -uy * 55 * cfg.chase;
          }
        } else if (o.n < s.size && dist < fleeR * 0.85) {
          ax += ux * 70 * cfg.flee;
          ay += uy * 70 * cfg.flee;
        }

        o.vx = o.baseVx * 0.55 + o.vx * 0.45 + ax * dt * 8;
        o.vy = o.vy * 0.9 + ay * dt * 8 + Math.sin(s.t * 2 + o.phase) * 6 * dt;
        const maxSp = 140 * cfg.spd;
        const sp = Math.hypot(o.vx, o.vy);
        if (sp > maxSp) { o.vx *= maxSp / sp; o.vy *= maxSp / sp; }
        o.x += o.vx * dt;
        o.y += o.vy * dt;
        o.y = cl(o.y, 86, h - 42);
      });

      s.bubbles.push({ x: s.x + R(-18, 18), y: s.y + R(-8, 10), r: R(2, 5), vy: R(-48, -24), life: 1 });
      if (s.bubbles.length > 80) s.bubbles.shift();
      s.bubbles.forEach(b => { b.y += b.vy * dt; b.life -= dt; });
      s.bubbles = s.bubbles.filter(b => b.life > 0);

      const reach = sr * (s.bite > 0 ? 2.4 : 0);
      let danger = 0;
      for (const o of s.objs) {
        if (o.dead) continue;
        const d = Math.hypot(o.x - s.x, o.y - s.y);
        if (o.relic && d < sr + o.r) {
          o.dead = 1; fx('grow'); buzz(10);
          if (String(o.e).indexOf('\u2764') >= 0) {
            s.life = Math.min(cfg.life + 2, s.life + 1); toast('+1 heart', C.d);
          } else if (o.e === '\u2B50') {
            s.shield = 5; toast('Apex shield', C.y);
          } else if (o.e === '\uD83C\uDF00') {
            s.objs.forEach(f => {
              if (!f.relic && !f.dead && Math.hypot(f.x - s.x, f.y - s.y) < 340) {
                f.x += (s.x - f.x) * 0.58; f.y += (s.y - f.y) * 0.58;
              }
            });
            toast('Vortex pull', C.q);
          } else {
            s.score += 320; toast('Pearl +320', C.y);
          }
          s.float.push({ x: o.x, y: o.y - 10, t: RELIC_TIP[o.e] || 'Power!', life: 0.9, c: C.y });
          continue;
        }
        if (o.relic) continue;
        const big = o.n > s.size;
        if (big && d < sr + o.r * 1.7) danger = Math.max(danger, 1 - d / (sr + o.r * 2.3));

        if (big && s.dash > 0 && d < sr + o.r * 1.85 && d > sr + o.r * 0.55 && !o.miss) {
          o.miss = 1;
          s.near++;
          const pts = 40 + o.n * 12;
          s.score += pts;
          s.float.push({ x: o.x, y: o.y, t: 'Near! +' + pts, life: 0.9, c: C.a });
          fx('near');
          if (s.near === 1 || s.near % 3 === 0) toast('Close call!', C.a);
        }

        if (big && d < sr + o.r * 0.7 && s.shield <= 0 && s.dash <= 0) {
          o.dead = 1; s.life--; s.shake = 0.34; s.combo = 0; s.comboT = 0; s.frenzy = 0; s.shield = 1.4;
          toast('Outmatched!', C.d); fx('bad'); burst(o.x, o.y, C.d, 14); buzz([30, 40, 30]);
          if (s.life <= 0) {
            end({ score: s.score | 0, reason: 'Eaten!', size: s.size, chain: s.bestChain });
            return;
          }
          continue;
        }
        if (!big) {
          const bodyHit = d < sr + o.r * 0.64;
          const chompHit = s.bite > 0 && inBiteCone(o.x, o.y, reach + o.r);
          if (bodyHit || chompHit) { o.dead = 1; eat(o, chompHit); }
        }
      }
      s.dangerNear = danger;
      s.objs = s.objs.filter(o => !o.dead && o.x > -120 && o.x < w + 120);
      s.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
      s.parts = s.parts.filter(p => p.life > 0);
      s.shake *= 1 - dt * 5;
      s.float.forEach(f => { f.y -= 38 * dt; f.life -= dt; });
      s.float = s.float.filter(f => f.life > 0);
      s.biome = s.size >= 5 ? 'abyss kelp' : s.size >= 3 ? 'open sea' : 'coral reef';
      if (s.size >= 5) {
        s.goal += dt * (1 + s.frenzy * 0.4);
        if (s.goal > 8) {
          end({ score: s.score | 0, won: true, size: s.size, chain: s.bestChain });
          return;
        }
      } else s.goal = Math.max(0, s.goal - dt * 0.45);
    }

    function draw() {
      if (s.shake > 0) {
        ctx.save();
        ctx.translate((Math.random() - 0.5) * s.shake * 24, (Math.random() - 0.5) * s.shake * 24);
      }
      const bg = s.biome === 'coral reef' ? ['#0a5f72', '#0d7f96', '#062a3a']
        : s.biome === 'open sea' ? ['#062f5a', '#0d4a6a', '#031a30']
        : ['#061526', '#073b2e', '#020812'];
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, bg[0]); g.addColorStop(0.55, bg[1]); g.addColorStop(1, bg[2]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255,255,255,.07)';
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        ctx.ellipse((i * 150 + s.t * 22) % (w + 40) - 20, 90 + i * 32, 90, 8, Math.sin(s.t + i), 0, Math.PI * 2);
        ctx.fill();
      }
      if (s.biome === 'coral reef') {
        ctx.fillStyle = 'rgba(255,120,140,.12)';
        for (let i = 0; i < 5; i++) {
          const cx = (i * w / 4 + Math.sin(s.t * 0.3 + i) * 20);
          ctx.beginPath(); ctx.moveTo(cx, h); ctx.quadraticCurveTo(cx + 20, h - 40, cx - 10, h - 70); ctx.quadraticCurveTo(cx - 30, h - 30, cx, h); ctx.fill();
        }
      }
      if (s.biome === 'abyss kelp') {
        ctx.strokeStyle = 'rgba(35,130,70,.5)'; ctx.lineWidth = 10;
        for (let i = 0; i < 8; i++) {
          const xx = i * w / 7 + Math.sin(s.t + i) * 13;
          ctx.beginPath(); ctx.moveTo(xx, h); ctx.quadraticCurveTo(xx + 30, h * 0.58, xx - 8, h * 0.2); ctx.stroke();
        }
      }

      for (const tr of s.trail) {
        ctx.globalAlpha = Math.max(0, tr.life * 1.4);
        ctx.fillStyle = s.dash > 0 ? 'rgba(95,251,241,.35)' : 'rgba(66,165,245,.2)';
        ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const b of s.bubbles) {
        ctx.globalAlpha = b.life; ctx.strokeStyle = 'rgba(210,245,255,.55)';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const o of s.objs) {
        if (o.gold) {
          ctx.fillStyle = 'rgba(255,215,0,.28)';
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.8, 0, Math.PI * 2); ctx.fill();
        }
        const bigger = o.n > s.size && !o.relic;
        const snack = !o.relic && o.n <= s.size;
        if (bigger) {
          ctx.fillStyle = 'rgba(255,110,110,' + (0.14 + s.dangerNear * 0.18) + ')';
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r * (1.4 + Math.sin(s.t * 6) * 0.08), 0, Math.PI * 2); ctx.fill();
        } else if (snack) {
          ctx.strokeStyle = 'rgba(95,251,241,.28)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.28, 0, Math.PI * 2); ctx.stroke();
        } else if (o.relic) {
          ctx.fillStyle = 'rgba(255,215,0,.18)';
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.6 + Math.sin(s.t * 4) * 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = bigger ? 0.78 : 1;
        ctx.font = (o.r * 2) + 'px sans-serif';
        ctx.fillText(o.e, o.x, o.y);
        ctx.globalAlpha = 1;
      }
      for (const p of s.parts) {
        ctx.globalAlpha = Math.max(0, p.life / 0.55);
        ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const sr = 28 + s.size * 7;
      const reach = sr * (s.bite > 0 ? 2.4 : 0);
      if (s.bite > 0) {
        ctx.fillStyle = 'rgba(255,224,178,' + (0.18 + s.bite) + ')';
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.arc(s.x, s.y, reach, s.face - 0.95, s.face + 0.95);
        ctx.closePath(); ctx.fill();
      }
      if (s.shield > 0) {
        ctx.strokeStyle = 'rgba(255,215,0,' + (0.4 + Math.min(0.4, s.shield * 0.1)) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, sr + 14, 0, Math.PI * 2); ctx.stroke();
      }
      if (s.sonar > 0) {
        ctx.strokeStyle = 'rgba(95,251,241,.35)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(s.x, s.y, (1 - s.sonar) * 260, 0, Math.PI * 2); ctx.stroke();
      }
      if (s.dash > 0) {
        ctx.strokeStyle = 'rgba(95,251,241,.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, sr + 8 + (0.5 - s.dash) * 30, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.font = (sr * 2) + 'px sans-serif';
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.scale(Math.cos(s.face) < 0 ? -1 : 1, 1);
      ctx.fillText('\uD83E\uDD88', 0, 0);
      ctx.restore();
      for (const f of s.float) {
        ctx.globalAlpha = Math.max(0, f.life / 0.85);
        ctx.fillStyle = f.c; ctx.font = 'bold 18px sans-serif';
        ctx.fillText(f.t, f.x, f.y); ctx.globalAlpha = 1;
      }
      if (s.frenzy > 0.2 || s.dangerNear > 0.35) {
        const a = Math.max(s.frenzy * 0.2, s.dangerNear * 0.28);
        const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7);
        vg.addColorStop(0, 'rgba(255,0,0,0)');
        vg.addColorStop(1, 'rgba(255,40,40,' + a + ')');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
      }
      if (s.shake > 0) ctx.restore();
    }

    function updateHud() {
      const need = s.size * 4;
      const sp = Math.min(100, Math.floor(s.xp / need * 100) || 0);
      let meta = cfg.name + ' · ' + (SIZE_NAMES[s.size] || ('Size ' + s.size)) + ' · ' + s.biome;
      if (s.frenzy > 0.5) meta += ' · FRENZY';
      if (s.near) meta += ' · near ' + s.near;
      elSc.textContent = String(s.score | 0);
      elMeta.textContent = meta;
      elLives.innerHTML = hearts(s.life, cfg.life);

      if (s.combo >= 2) {
        elCombo.classList.add('on');
        elCombo.classList.toggle('hot', s.combo >= 6);
        elCombo.textContent = 'x' + s.combo + ' combo';
      } else elCombo.classList.remove('on');

      const prog = s.size >= 5 ? Math.min(1, s.goal / 8) : Math.min(1, s.xp / need);
      elApex.style.width = (prog * 100) + '%';
      elBar.classList.toggle('apex', s.size >= 5);
      elLab.textContent = s.size >= 5 ? 'APEX HOLD' : 'GROW TO APEX';
      elComboFill.style.width = (Math.max(0, Math.min(1, s.comboT / 1.8)) * 100) + '%';

      if (s.size >= 5) {
        elMission.textContent = 'Hold the ocean \u2014 APEX ' + Math.min(8, s.goal.toFixed(1)) + ' / 8s';
      } else {
        elMission.textContent = 'Grow: ' + s.xp + ' / ' + need + '  ·  next ' + (SIZE_NAMES[s.size + 1] || 'size') + '  ·  ' + sp + '%';
      }

      const biteReady = s.cd <= 0 ? 100 : Math.max(0, 100 - (s.cd / 0.48) * 100);
      const dashReady = s.dashCD <= 0 ? 100 : Math.max(0, 100 - (s.dashCD / 2.7) * 100);
      elBite.style.setProperty('--ready', String(biteReady));
      elDash.style.setProperty('--ready', String(dashReady));
      elBite.disabled = s.cd > 0;
      elDash.disabled = s.dashCD > 0;
      elBite.querySelector('span').innerHTML = s.cd > 0 ? Math.ceil(s.cd * 10) / 10 + 's' : '\uD83D\uDC1F<br>Bite';
      elDash.querySelector('span').innerHTML = s.dashCD > 0 ? Math.ceil(s.dashCD * 10) / 10 + 's' : '\u26A1<br>Dash';
    }

    function loop(t) {
      if (ended || paused) return;
      const dt = Math.min(0.045, (t - last) / 1000 || 0.016);
      last = t;
      step(dt, t);
      if (ended) return;
      draw();
      updateHud();
      raf = requestAnimationFrame(loop);
    }

    function pointer(e) {
      const r = cv.getBoundingClientRect();
      s.tx = e.clientX - r.left;
      s.ty = e.clientY - r.top;
    }
    cv.addEventListener('pointerdown', (e) => {
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      const now = performance.now();
      if (now - lastTap < 280) doDash();
      lastTap = now;
      pointer(e);
    });
    cv.addEventListener('pointermove', pointer);
    const onKey = (e) => {
      if (e.key === ' ') { e.preventDefault(); doBite(); }
      else if (e.key === 'Shift') doDash();
      else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') s.ty -= 40;
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') s.ty += 40;
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') s.tx -= 40;
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') s.tx += 40;
    };
    document.addEventListener('keydown', onKey);
    stopGame = () => {
      ended = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      document.removeEventListener('keydown', onKey);
    };
    bootSchool();
    last = performance.now();
    raf = requestAnimationFrame(loop);
    document.addEventListener('visibilitychange',function(){if(document.hidden){if(raf)cancelAnimationFrame(raf);}else{raf=requestAnimationFrame(loop);if(typeof audio!=='undefined'&&audio&&audio.resume)audio.resume().catch(function(){});}});
  }

  showMenu();
})();
</script>
