<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a2a2e'/%3E%3Ctext y='.9em' x='.1em' font-size='80'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<title>Amber's Pet Clinic</title>
<style>
  :root {
    --bg: #0a2a2e; --card: rgba(255,255,255,0.07); --border: rgba(255,255,255,0.16);
    --mint: #26A69A; --mint2: #4DD0E1; --coral: #FF8A65; --gold: #FFD700; --green: #69F0AE; --ink: #fff;
    --shadow-mint: #00695C; --shadow-blue: #0D47A1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  #app {
    width: 100vw; height: 100vh; height: 100dvh; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(38,166,154,0.28), transparent 50%),
      radial-gradient(ellipse 70% 45% at 85% 20%, rgba(77,208,225,0.18), transparent 45%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,138,101,0.1), transparent 50%),
      linear-gradient(165deg, #134048 0%, #0a2a2e 45%, #071c20 100%);
  }
  .bg-orbs { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg-orbs span {
    position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.45;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .bg-orbs span:nth-child(1) {
    width: 180px; height: 180px; left: -5%; top: 15%;
    background: rgba(38,166,154,0.5); animation-delay: 0s;
  }
  .bg-orbs span:nth-child(2) {
    width: 220px; height: 220px; right: -8%; top: 40%;
    background: rgba(77,208,225,0.4); animation-delay: -4s;
  }
  .bg-orbs span:nth-child(3) {
    width: 160px; height: 160px; left: 30%; bottom: -5%;
    background: rgba(255,138,101,0.3); animation-delay: -7s;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(18px, -22px) scale(1.08); }
    66% { transform: translate(-14px, 12px) scale(0.95); }
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10; padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .card {
    background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
    border: 1px solid var(--border); border-radius: 22px;
    padding: 22px 20px; width: min(420px, 94vw); max-height: 90dvh; overflow-y: auto; text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .title {
    font-size: clamp(26px, 6.5vw, 40px); font-weight: 900; letter-spacing: 0.5px;
    background: linear-gradient(135deg, #4DD0E1, #26A69A 55%, #FFD54F);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px; animation: titlePulse 2.4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { filter: brightness(1); transform: scale(1); }
    50% { filter: brightness(1.12); transform: scale(1.02); }
  }
  .sub { opacity: 0.88; font-size: 13px; margin-bottom: 14px; line-height: 1.45; }
  .btn {
    border: 0; border-radius: 14px; padding: 12px 22px; margin: 5px; font-weight: 800;
    font-size: 15px; cursor: pointer; color: #1a1a1a; min-height: 44px; font-family: inherit;
    background: linear-gradient(135deg, #4DD0E1, #26A69A);
    box-shadow: 0 5px 0 var(--shadow-mint), 0 8px 18px rgba(0,0,0,0.35);
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 0.3px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--shadow-mint), 0 10px 22px rgba(0,0,0,0.35); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow-mint), 0 4px 8px rgba(0,0,0,0.35); }
  .btn-sec {
    background: linear-gradient(135deg, #FF8A65, #FF6F61); color: #1a1a1a;
    box-shadow: 0 5px 0 #C75B39, 0 8px 18px rgba(0,0,0,0.35);
  }
  .btn-sec:hover { box-shadow: 0 7px 0 #C75B39, 0 10px 22px rgba(0,0,0,0.35); }
  .btn-sec:active { box-shadow: 0 2px 0 #C75B39, 0 4px 8px rgba(0,0,0,0.35); }
  .btn-ghost {
    background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.16); transform: none; box-shadow: none; }
  .btn-ghost:active { transform: scale(0.97); box-shadow: none; }
  .btn:disabled { opacity: 0.4; pointer-events: none; transform: none; box-shadow: none; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .play {
    position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 2;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px; margin-bottom: 6px; flex-shrink: 0;
  }
  .topbar .score-live {
    min-width: 52px; text-align: right; font-weight: 900; color: var(--gold);
    text-shadow: 0 0 12px rgba(255,215,0,0.35); transition: transform 0.15s;
  }
  .cust-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(38,166,154,0.12));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 10px 12px; margin-bottom: 6px; flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    animation: slideDown 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .cust-name { font-weight: 900; font-size: 16px; margin-bottom: 6px; letter-spacing: 0.2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip {
    font-size: 11px; padding: 5px 11px; border-radius: 999px; font-weight: 700;
    background: rgba(38,166,154,0.28); border: 1px solid rgba(77,208,225,0.45);
    transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  }
  .chip.ok {
    background: rgba(105,240,174,0.28); border-color: rgba(105,240,174,0.65);
    box-shadow: 0 0 12px rgba(105,240,174,0.35);
    animation: chipPop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1), chipGlow 1.6s ease-in-out 0.45s infinite;
  }
  @keyframes chipPop {
    0% { transform: scale(0.75); }
    55% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  @keyframes chipGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(105,240,174,0.25); }
    50% { box-shadow: 0 0 16px rgba(105,240,174,0.55); }
  }
  .match-bar.complete > i {
    animation: barShine 1.2s ease-in-out infinite;
  }
  @keyframes barShine {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }
  .score-live.bump {
    animation: scoreBump 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  @keyframes scoreBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); color: #fff; }
    100% { transform: scale(1); }
  }
  .preview {
    flex: 1; min-height: 180px; max-height: 42dvh; position: relative;
    background:
      radial-gradient(ellipse 90% 70% at 50% 0%, rgba(178,245,234,0.28), transparent 55%),
      radial-gradient(ellipse at 15% 80%, rgba(77,208,225,0.12), transparent 40%),
      radial-gradient(ellipse at 85% 75%, rgba(255,138,101,0.1), transparent 40%),
      linear-gradient(180deg, #2a5a62 0%, #1a3d44 40%, #0f2a30 100%);
    border-radius: 20px; border: 1px solid var(--border); margin-bottom: 6px;
    display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
    box-shadow: inset 0 0 50px rgba(38,166,154,0.12), 0 12px 32px rgba(0,0,0,0.3);
    padding-bottom: 4px;
  }
  .preview::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.07) 50%, transparent 60%);
    animation: shine 5s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 100% { transform: translateX(-30%); opacity: 0; }
    40% { opacity: 1; }
    70% { transform: translateX(30%); opacity: 0; }
  }
  .clinic-frame {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: min(90%, 340px); height: 70%; border-radius: 16px;
    border: 2px solid rgba(77,208,225,0.3);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.06), inset 0 0 30px rgba(255,255,255,0.04);
    pointer-events: none; z-index: 1;
  }
  .clinic-frame::after {
    content: 'PET CLINIC'; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 900; letter-spacing: 2px; color: rgba(255,255,255,0.45);
    background: rgba(10,42,46,0.85); padding: 2px 10px; border-radius: 0 0 8px 8px;
  }
  .exam-table {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18%;
    background: linear-gradient(180deg, #80CBC4 0%, #4DB6AC 40%, #00897B 100%);
    border-top: 3px solid #B2DFDB; z-index: 1;
    box-shadow: 0 -8px 20px rgba(0,0,0,0.25);
  }
  .exam-table::before {
    content: ''; position: absolute; top: 28%; left: 10%; right: 10%; height: 6px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    border-radius: 3px;
  }
  .avatar-wrap {
    position: relative; z-index: 3; width: min(220px, 62vw); height: min(240px, 55vw);
    max-height: 90%; margin-bottom: 4%;
    animation: facePop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4));
  }
  .avatar-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .avatar-wrap .pet-rig {
    transform-origin: 50% 78%;
    animation: idleBob 2.6s ease-in-out infinite;
  }
  .avatar-wrap.mood-happy .pet-rig { animation: happyBounce 0.7s cubic-bezier(0.34, 1.4, 0.64, 1), idleBob 2.2s ease-in-out 0.7s infinite; }
  .avatar-wrap.mood-sleepy .pet-rig { animation: sleepySway 3.4s ease-in-out infinite; }
  .avatar-wrap.react-pop .pet-rig { animation: reactPop 0.55s cubic-bezier(0.34, 1.55, 0.64, 1); }
  .avatar-wrap.react-pet { filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4)) drop-shadow(0 0 16px rgba(255,138,101,0.45)); }
  .avatar-wrap.react-pet .pet-rig { animation: reactPop 0.6s cubic-bezier(0.34, 1.55, 0.64, 1); }
  .avatar-wrap.idle-react .pet-rig { animation: autoReact 0.9s ease-in-out; }
  .avatar-wrap .blush { opacity: 0; transform-origin: 100px 120px; pointer-events: none; }
  .avatar-wrap.react-pet .blush { animation: blushIn 0.7s ease both; }
  @keyframes autoReact {
    0% { transform: rotate(0) translateY(0); }
    20% { transform: rotate(-5deg) translateY(-3px); }
    45% { transform: rotate(4deg) translateY(0); }
    70% { transform: rotate(-2deg) translateY(-1px); }
    100% { transform: rotate(0) translateY(0); }
  }
  @keyframes blushIn {
    0% { opacity: 0; }
    30% { opacity: 0.85; }
    70% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  .avatar-wrap.act-feed .pet-rig { animation: actFeed 1.1s cubic-bezier(0.34, 1.4, 0.64, 1); }
  .avatar-wrap.act-care .pet-rig { animation: actCare 1.15s cubic-bezier(0.34, 1.4, 0.64, 1); }
  .avatar-wrap.act-rest .pet-rig { animation: actRest 1.25s ease-in-out; }
  .avatar-wrap.act-play .pet-rig { animation: actPlay 1.2s cubic-bezier(0.34, 1.55, 0.64, 1); }
  .avatar-wrap.act-feed .eye-pair { animation: none; }
  .avatar-wrap.act-care { filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4)) drop-shadow(0 0 18px rgba(105,240,174,0.55)); }
  .avatar-wrap.act-play { filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4)) drop-shadow(0 0 20px rgba(255,215,0,0.45)); }
  .avatar-wrap .ear-l { transform-origin: 72px 78px; animation: earWiggleL 3.2s ease-in-out infinite; }
  .avatar-wrap .ear-r { transform-origin: 128px 78px; animation: earWiggleR 3.2s ease-in-out infinite; animation-delay: -0.4s; }
  .avatar-wrap.mood-happy .ear-l, .avatar-wrap.act-play .ear-l, .avatar-wrap.act-feed .ear-l { animation-duration: 0.9s; }
  .avatar-wrap.mood-happy .ear-r, .avatar-wrap.act-play .ear-r, .avatar-wrap.act-feed .ear-r { animation-duration: 0.9s; }
  .avatar-wrap .eye-pair { transform-origin: 100px 100px; }
  .avatar-wrap:not(.mood-sleepy) .eye-pair { animation: blink 4.8s ease-in-out infinite; }
  .avatar-wrap .tail { transform-origin: 148px 150px; animation: tailWag 1.1s ease-in-out infinite; }
  .avatar-wrap.mood-sleepy .tail { animation: none; }
  .avatar-wrap.act-play .tail, .avatar-wrap.act-feed .tail { animation: tailWag 0.35s ease-in-out infinite; }
  .avatar-wrap .fx-layer { pointer-events: none; }
  .avatar-wrap .sparkle { animation: sparkleTwinkle 1.1s ease-in-out infinite; transform-origin: center; }
  .avatar-wrap .sparkle:nth-child(2) { animation-delay: 0.2s; }
  .avatar-wrap .sparkle:nth-child(3) { animation-delay: 0.45s; }
  .avatar-wrap .zzz { animation: zzzFloat 2s ease-in-out infinite; }
  .avatar-wrap .heart-pop { animation: heartPop 1.1s ease-out infinite; }
  .avatar-wrap .bowl { animation: bowlBob 1.4s ease-in-out infinite; transform-origin: 148px 163px; }
  .avatar-wrap .toy { animation: toyWiggle 1.3s ease-in-out infinite; transform-origin: 48px 165px; }
  .avatar-wrap .bandage { animation: bandageIn 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
  .avatar-wrap .munch { animation: munchBite 0.55s ease-in-out 2; transform-origin: 100px 120px; }
  @keyframes facePop {
    from { opacity: 0; transform: scale(0.88) translateY(14px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes idleBob {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50% { transform: translateY(-5px) scale(1.02, 0.98); }
  }
  @keyframes happyBounce {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-14px) scale(1.06, 0.94); }
    55% { transform: translateY(0) scale(0.97, 1.04); }
    75% { transform: translateY(-6px) scale(1.03, 0.98); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes sleepySway {
    0%, 100% { transform: translateY(2px) rotate(-1.5deg); }
    50% { transform: translateY(-2px) rotate(1.5deg); }
  }
  @keyframes reactPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.1) translateY(-8px); }
    60% { transform: scale(0.96) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }
  @keyframes actFeed {
    0% { transform: scale(1) translateY(0); }
    15% { transform: scale(1.08, 0.92) translateY(4px); }
    35% { transform: scale(0.95, 1.08) translateY(-10px); }
    55% { transform: scale(1.06, 0.96) translateY(0); }
    75% { transform: scale(0.98, 1.04) translateY(-4px); }
    100% { transform: scale(1) translateY(0); }
  }
  @keyframes actCare {
    0% { transform: translateX(0) rotate(0); }
    15% { transform: translateX(-8px) rotate(-4deg); }
    30% { transform: translateX(8px) rotate(4deg); }
    45% { transform: translateX(-6px) rotate(-3deg); }
    60% { transform: translateX(6px) rotate(3deg) scale(1.05); }
    80% { transform: translateX(-2px) scale(1.08); }
    100% { transform: translateX(0) rotate(0) scale(1); }
  }
  @keyframes actRest {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(10px) scale(1.04, 0.92); }
    70% { transform: translateY(6px) scale(1.02, 0.96) rotate(-2deg); }
    100% { transform: translateY(2px) scale(1) rotate(0); }
  }
  @keyframes actPlay {
    0% { transform: translateY(0) rotate(0) scale(1); }
    20% { transform: translateY(-18px) rotate(-8deg) scale(1.08); }
    40% { transform: translateY(2px) rotate(8deg) scale(0.96); }
    60% { transform: translateY(-12px) rotate(-5deg) scale(1.06); }
    80% { transform: translateY(0) rotate(4deg) scale(1.02); }
    100% { transform: translateY(0) rotate(0) scale(1); }
  }
  @keyframes munchBite {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.72); }
  }
  @keyframes earWiggleL {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-8deg); }
    60% { transform: rotate(5deg); }
  }
  @keyframes earWiggleR {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(8deg); }
    60% { transform: rotate(-5deg); }
  }
  @keyframes blink {
    0%, 42%, 46%, 100% { transform: scaleY(1); }
    44% { transform: scaleY(0.08); }
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(18deg); }
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.75) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(18deg); }
  }
  @keyframes zzzFloat {
    0% { opacity: 0.2; transform: translate(0, 6px) scale(0.85); }
    50% { opacity: 1; transform: translate(4px, -6px) scale(1.05); }
    100% { opacity: 0.25; transform: translate(8px, -14px) scale(0.9); }
  }
  @keyframes heartPop {
    0% { opacity: 0; transform: translateY(6px) scale(0.5); }
    30% { opacity: 1; transform: translateY(0) scale(1.15); }
    100% { opacity: 0.75; transform: translateY(-8px) scale(1); }
  }
  @keyframes bowlBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes toyWiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes bandageIn {
    from { opacity: 0; transform: scale(0.5) rotate(-12deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  .preview-fx {
    position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden;
  }
  .preview-fx .float-heart {
    position: absolute; font-size: 18px; left: 50%; bottom: 28%;
    animation: floatHeart 1.1s ease-out forwards;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  @keyframes floatHeart {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.4); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -90px) scale(0.9); }
  }
  .preview-fx .care-burst {
    position: absolute; left: 50%; top: 42%; width: 10px; height: 10px; border-radius: 50%;
    animation: careBurst 0.7s ease-out forwards;
  }
  @keyframes careBurst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(1.4); }
  }
  .preview-fx .float-emoji {
    position: absolute; left: 50%; top: 40%; font-size: 22px; line-height: 1;
    animation: floatEmoji 1s ease-out forwards;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35));
  }
  @keyframes floatEmoji {

function productTags(look) {
  const tags = [];
  ['feed', 'care', 'rest', 'play'].forEach(st => {
    const id = look[st];
    if (!id) return;
    const opt = STATION_OPTS[st].find(x => x.id === id);
    if (opt) tags.push(...opt.tags);
  });
  return tags;
}
function scoreLook(look, want, difficulty) {
  const filled = [look.feed, look.care, look.rest, look.play].filter(Boolean).length;
  const fillPts = filled === 4 ? 25 : filled * 5;
  const have = productTags(look);
  const matches = want.filter(w => have.includes(w));
  const need = LEVELS[difficulty].need;
  let matchPts = 0;
  matches.forEach((_, i) => { matchPts += i < need ? 20 : 8; });
  let bonus = 0;
  if (difficulty === 'hard' && matches.length >= want.length) bonus += 10;
  if (difficulty === 'easy' && matches.length >= 2) matchPts = Math.max(matchPts, 40);
  return Math.min(100, fillPts + matchPts + bonus);
}
function matchCount(look, want) {
  const have = productTags(look);
  return want.filter(w => have.includes(w)).length;
}
function loadBest(lvl) {

}
function saveBest(lvl, score) {
  const prev = loadBest(lvl);
  if (score > prev) {
    try { localStorage.setItem('petclinic_best_' + lvl, String(score)); } catch (e) {}

    const text = lines[key % lines.length];
    // Visible proof the action fired (also helps on slow devices)
    setToast((option && option.emoji ? option.emoji + ' ' : '') + text);
    if (clearFlashTimer.current) clearTimeout(clearFlashTimer.current);
    // Always set pulse + flash first so the pet reacts even if FX building fails
    setActionPulse({ kind: kind, key: key });
    setFlash({ kind: kind, text: text, key: key });
    if (clearPulseTimer.current) clearTimeout(clearPulseTimer.current);
    // Keep reaction visible long enough for kids (and for slow devices)
    clearPulseTimer.current = setTimeout(function () { setActionPulse(null); }, 1600);
    clearFlashTimer.current = setTimeout(function () {
      setFlash(null);
      setToast(null);
    }, 1400);
    try {
      const bits = buildActionFx(kind, option) || [];
      setFx(bits);
      if (clearFxTimer.current) clearTimeout(clearFxTimer.current);
      clearFxTimer.current = setTimeout(function () { setFx([]); }, 1600);
    } catch (eFx) {
      setFx([]);
    }
    try { playActionSound(kind); } catch (eSnd) {}
  };

  const PET_LINES = ['❤️', 'hehe!', 'pet me!', 'boop!', '💕', 'so soft!', 'hehe~', '🐾'];

  const reactPet = (kind, withTalk, soft) => {
    const key = ++pulseId.current;
    const klass = kind === 'idle' ? 'idle-react' : 'react-pet';
    setPetPulse({ klass: klass, key: key });
    if (clearPetTimer.current) clearTimeout(clearPetTimer.current);
    clearPetTimer.current = setTimeout(() => setPetPulse(null), kind === 'idle' ? 900 : 650);
    if (withTalk) {
      const text = PET_LINES[Math.floor(Math.random() * PET_LINES.length)];
      setPetTalk({ text: text, key: key });
      if (clearTalkTimer.current) clearTimeout(clearTalkTimer.current);
      clearTalkTimer.current = setTimeout(() => setPetTalk(null), 1000);
    }
    try { spawnHearts(kind === 'idle' ? 1 : 2); } catch (e) {}
    try { playPetSound(muted, soft); } catch (e) {}
  };

  const handlePet = () => {
    busyRef.current = !!(actionPulse || petPulse);
    if (busyRef.current) return;
    reactPet('pet', true, false);
  };

  const scheduleIdle = () => {
    const wait = 8000 + Math.random() * 4000;
    idleTimer.current = setTimeout(() => {
      if (!actionPulse && !petPulse && !free) {
        reactPet('idle', false, true);
      }
      scheduleIdle();
    }, wait);
  };

  const pick = (stationId, id) => {
    const list = STATION_OPTS[stationId] || [];
    let option = { id: id, emoji: '\u2728', name: id };
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) { option = list[i]; break; }
    }
    setHistory(function (h) {
      return (h.length > 20 ? h.slice(-20) : h).concat([look]);
    });
    setLook(function (prev) {
      return {
        feed: stationId === 'feed' ? id : prev.feed,
        care: stationId === 'care' ? id : prev.care,
        rest: stationId === 'rest' ? id : prev.rest,
        play: stationId === 'play' ? id : prev.play,
      };
    });
    fireCareAction(stationId, option);
  };

  const prevScore = useRef(0);
  const liveScore = pet && !free ? scoreLook(look, pet.want, difficulty) : 0;
  const have = productTags(look);
  const matches = pet && pet.want ? matchCount(look, pet.want) : 0;
  const actionKind = actionPulse ? actionPulse.kind : null;

  useEffect(() => {
    if (!free && liveScore > prevScore.current) {
      setScoreBump(true);
      const t = setTimeout(() => setScoreBump(false), 320);
      prevScore.current = liveScore;
      return () => clearTimeout(t);
    }
    prevScore.current = liveScore;
  }, [liveScore, free]);

  useEffect(() => {
    if (!free && matches > prevMatches.current) {
      const gained = matches - prevMatches.current;
      setTimeout(() => spawnHearts(Math.min(3, gained + 1)), 200);
      blip(920, 0.07, 'sine', muted);
    }
    prevMatches.current = matches;
  }, [matches, free, muted]);

  useEffect(() => () => {
    if (clearPulseTimer.current) clearTimeout(clearPulseTimer.current);
    if (clearFlashTimer.current) clearTimeout(clearFlashTimer.current);
    if (clearFxTimer.current) clearTimeout(clearFxTimer.current);
    if (clearPetTimer.current) clearTimeout(clearPetTimer.current);
    if (clearTalkTimer.current) clearTimeout(clearTalkTimer.current);
    if (idleTimer.current) clearTimeout(idleTimer.current);
  }, []);

  useEffect(() => {
    if (free) return;
    scheduleIdle();
    return () => { if (idleTimer.current) clearTimeout(idleTimer.current); };
  }, [free]);

  const undo = () => {
    if (!history.length) return;
    blip(440, 0.06, 'triangle', muted);
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setLook(prev);
    setActionPulse(null);
    setPetPulse(null);
    setPetTalk(null);
  };

  const clearStation = () => {
    setHistory(h => (h.length > 20 ? h.slice(-20) : h).concat([look]));
    setLook(prev => {
      const next = Object.assign({}, prev);
      next[station] = null;
      return next;
    });
  };

  const finish = () => {
    if (free) {
      onDone({ look: look, score: 0, free: true });
      return;
    }
    const sc = scoreLook(look, pet.want, difficulty);
    blip(sc >= 60 ? 880 : 220, 0.12, sc >= 60 ? 'sine' : 'sawtooth', muted);
    if (sc >= 50) spawnHearts(sc >= 80 ? 5 : 3);
    setToast(sc >= 80 ? 'So happy! +' + sc : sc >= 50 ? 'Feeling better! +' + sc : 'Hmm… +' + sc);
    setTimeout(() => onDone({ look: look, score: sc }), 900);
  };

  const options = STATION_OPTS[station] || FEED;
  const selectedId = look[station];
  const filled = [look.feed, look.care, look.rest, look.play].filter(Boolean).length;
  const wantLen = pet && pet.want ? pet.want.length : 1;
  const barComplete = !free && matches >= wantLen && wantLen > 0;

  return (
    <div className="play">
      <div className="topbar">
        <button className="btn btn-ghost" style={{ padding: '8px 12px', fontSize: 13 }} onClick={onBack}>Menu</button>
        <span>{progressLabel || (free ? 'Free Play' : pet.name)}</span>
        <span className={'score-live' + (scoreBump ? ' bump' : '')}>
          {!free ? liveScore : ''}
        </span>
      </div>
      {!free && pet && (
        <div className="cust-card">
          <div className="cust-name">{speciesEmoji(pet.species)} {pet.name} needs…</div>
          <div className="chips">
            {pet.want.map(w => (
              <span key={w} className={'chip' + (have.includes(w) ? ' ok' : '')}>
                {have.includes(w) ? '✓ ' : ''}{chipLabel(w)}
              </span>
            ))}
          </div>
          <div className={'match-bar' + (barComplete ? ' complete' : '')}>
            <i style={{ width: (matches / wantLen * 100) + '%' }} />
          </div>
        </div>
      )}
      <div className={'preview' + (actionKind ? ' flash-' + actionKind : '')}>
        <div className="clinic-frame" />
        <div className="exam-table" />
        <PetPreview look={look} pet={pet} actionPulse={actionPulse} petPulse={petPulse} petTalk={petTalk} onPet={handlePet} />
        {flash && (
          <div key={flash.key} className={'action-flash ' + flash.kind}>{flash.text}</div>
        )}
        <div className="preview-fx" aria-hidden="true">
          {fx.map(f => {
            if (f.type === 'heart') {
              return <span key={f.id} className="float-heart" style={{ '--dx': f.dx, animationDelay: (f.delay || 0) + 's' }}>💖</span>;
            }
            if (f.type === 'emoji') {
              return <span key={f.id} className="float-emoji" style={{ '--dx': f.dx, '--rot': f.rot || '12deg', animationDelay: (f.delay || 0) + 's' }}>{f.emoji}</span>;
            }
            if (f.type === 'bubble') {
              return <i key={f.id} className="bubble" style={{ '--dx': f.dx, '--dy': f.dy || '0px', animationDelay: (f.delay || 0) + 's' }} />;
            }
            if (f.type === 'crumb') {
              return <i key={f.id} className="crumb" style={{ '--dx': f.dx, '--dy': f.dy, animationDelay: (f.delay || 0) + 's' }} />;
            }
            if (f.type === 'star') {
              return <span key={f.id} className="star-bit" style={{ '--dx': f.dx, animationDelay: (f.delay || 0) + 's' }}>{f.emoji || '⭐'}</span>;
            }
            if (f.type === 'ring') {
              return <i key={f.id} className="splash-ring" />;
            }
            return <i key={f.id} className="care-burst" style={{ '--bx': f.bx, '--by': f.by, background: f.color }} />;
          })}
        </div>
      </div>
      <div className="stations">
        {STATIONS.map(s => {
          const has = look[s.id];
          return (
            <button
              key={s.id}
              className={(station === s.id ? 'on ' : '') + (has ? 'filled' : '')}
              onClick={() => { setStation(s.id); blip(400, 0.04, 'triangle', muted); }}
            >{s.label}</button>
          );
        })}
      </div>
      <div className="picker" key={station}>
        {options.map(o => (
          <button
            key={o.id}
            className={'pick' + (selectedId === o.id ? ' on' : '')}
            onClick={() => pick(station, o.id)}
          >
            <div className="sw">{o.emoji}</div>
            <span>{o.name}</span>
          </button>
        ))}
      </div>
      <div className="actions">
        <button className="btn btn-ghost" onClick={undo} disabled={!history.length}>Undo</button>
        <button className="btn btn-ghost" onClick={clearStation}>Clear</button>
        <button className="btn" onClick={finish} disabled={filled === 0}>{free ? 'Save pet' : 'Done!'}</button>
      </div>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function OpenClinic({ level, muted, onBack }) {
  const cfg = LEVELS[level];
  const [queue] = useState(() => {
    const list = [...PETS];
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list.slice(0, cfg.n).map(p => {
      // For hard, ensure enough wants; for easy trim
      let want = [...p.want];
      if (level === 'easy' && want.length > 3) want = want.slice(0, 3);
      if (level === 'hard' && want.length < 4) {
        const pool = ['need:hungry', 'need:dirty', 'need:hurt', 'need:sleepy', 'need:lonely', 'need:scared', 'need:bored'];
        while (want.length < 4) {
          const t = pool[Math.floor(Math.random() * pool.length)];
          if (!want.includes(t)) want.push(t);
        }
      }
      return { ...p, want };
    });
  });
  const [idx, setIdx] = useState(0);
  const [total, setTotal] = useState(0);
  const [phase, setPhase] = useState('design');
  const [lastScore, setLastScore] = useState(0);
  const [newBest, setNewBest] = useState(false);

  const pet = queue[idx];

  const onDone = ({ score }) => {
    const t = total + score;
    setTotal(t);
    setLastScore(score);
    if (idx + 1 >= queue.length) {
      setNewBest(saveBest(level, t));
      setPhase('over');
      blip(1040, 0.15, 'sine', muted);
    } else {
      setPhase('result');
      setTimeout(() => { setIdx(i => i + 1); setPhase('design'); }, 900);
    }
  };

  if (phase === 'over') {
    return (
      <div className="overlay">
        {total >= 200 && <Confetti count={36} />}
        <div className="card">
          <div className="menu-hero">{newBest ? '🏆' : '🐾'}</div>
          <div className="title">Clinic closed!</div>
          <div className="result-total">{total}</div>
          {newBest && <div className="new-best">New Best!</div>}
          <div className="sub">You helped {queue.length} pets on {cfg.label}</div>
          <div className="row">
            <button className="btn" onClick={onBack}>Menu</button>
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'result') {
    return (
      <div className="overlay">
        {lastScore >= 80 && <Confetti count={22} />}
        <div className="card">
          <div className="result-emoji">{lastScore >= 80 ? '💕' : lastScore >= 50 ? '👍' : '😊'}</div>
          <div className="result-score">+{lastScore}</div>
          <div className="sub">Total {total} · Next patient…</div>
        </div>
      </div>
    );
  }

  return (
    <DesignScreen
      pet={pet}
      difficulty={level}
      free={false}
      muted={muted}
      onDone={onDone}
      onBack={onBack}
      progressLabel={'Pet ' + (idx + 1) + '/' + queue.length}
      key={pet.id + '-' + idx}
    />
  );
}

function FreePlay({ muted, onBack }) {
  const [pet, setPet] = useState(PETS[0]);
  const [picking, setPicking] = useState(true);
  const [savedToast, setSavedToast] = useState(false);

  if (picking) {
    return (
      <div className="overlay">
        <div className="card">
          <div className="title" style={{ fontSize: 28 }}>Pick a pet</div>
          <div className="sub">Who gets free care today?</div>
          <div className="row" style={{ marginTop: 6 }}>
            {PETS.map(p => (
              <button
                key={p.id}
                className="btn btn-ghost face-pick"
                style={{ fontSize: 13, padding: '10px 12px', minWidth: 76 }}
                onClick={() => { setPet(p); setPicking(false); blip(660, 0.07, 'sine', muted); }}
              >
                <div className="skin-dot" style={{ background: p.base }}>{speciesEmoji(p.species)}</div>
                {p.name}
              </button>
            ))}
          </div>
          <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={onBack}>Back</button>
        </div>
      </div>
    );
  }

  return (
    <>
      <DesignScreen
        pet={pet}
        free
        muted={muted}
        onBack={onBack}
        onDone={({ look }) => {
          const g = loadGallery();
          g.push({ t: Date.now(), look, petId: pet.id, name: pet.name, species: pet.species, base: pet.base, accent: pet.accent, eyes: pet.eyes });
          saveGallery(g);
          blip(880, 0.1, 'sine', muted);
          setSavedToast(true);
          setTimeout(() => setSavedToast(false), 1200);
        }}
      />
      {savedToast && <div className="toast">Saved to gallery!</div>}
    </>
  );
}

function Gallery({ onBack }) {
  const [items, setItems] = useState(loadGallery);
  const [tappedId, setTappedId] = useState(null);
  const tapTimer = useRef(null);

  const remove = (i) => {
    const next = items.filter((_, idx) => idx !== i);
    setItems(next);
    saveGallery(next);
  };

  const tapPet = (t) => {
    setTappedId(t);
    if (tapTimer.current) clearTimeout(tapTimer.current);
    tapTimer.current = setTimeout(() => setTappedId(null), 650);
  };

  useEffect(() => () => { if (tapTimer.current) clearTimeout(tapTimer.current); }, []);

  return (
    <div className="overlay">
      <div className="card" style={{ width: 'min(440px, 96vw)' }}>
        <div className="title" style={{ fontSize: 28 }}>Gallery</div>
        <div className="sub">{items.length ? 'Your happy patients' : 'No saved pets yet — try Free Play!'}</div>
        <div className="gallery-grid">
          {items.slice().reverse().map((it, revIdx) => {
            const i = items.length - 1 - revIdx;
            const pet = {
              name: it.name, species: it.species, base: it.base,
              accent: it.accent, eyes: it.eyes,
            };
            const isTapped = tappedId === it.t + '-' + i;
            return (
              <div key={it.t + '-' + i} className="gallery-item">
                <button className="del" onClick={() => remove(i)} aria-label="Delete">×</button>
                <div className="mini" onPointerDown={() => tapPet(it.t + '-' + i)} style={{ cursor: 'pointer' }}>
                  <PetPreview
                    look={it.look || {}}
                    pet={pet}
                    petPulse={isTapped ? { klass: 'react-pet', key: it.t } : null}
                  />
                </div>
                <div style={{ fontSize: 12, fontWeight: 700, marginTop: 4 }}>{it.name || 'Pet'}</div>
              </div>
            );
          })}
        </div>
        <button className="btn btn-ghost" onClick={onBack}>Back</button>
      </div>
    </div>
  );
}

function Tutorial({ onClose }) {
  return (
    <div className="overlay" style={{ zIndex: 30, background: 'rgba(0,0,0,0.55)' }}>
      <div className="card">
        <div className="title" style={{ fontSize: 26 }}>How to play</div>
        <div className="sub" style={{ textAlign: 'left' }}>
          <p style={{ marginBottom: 8 }}>1. Read the mint chips — that is what the pet needs.</p>
          <p style={{ marginBottom: 8 }}>2. Use Feed, Care, Rest, and Play. Match the chips!</p>
          <p style={{ marginBottom: 8 }}>3. Chips turn green when you match. Tap Done when ready.</p>
          <p>Easy needs fewer matches. Hard wants a full care plan.</p>
        </div>
        <button className="btn" onClick={onClose}>Let's go!</button>
      </div>
    </div>
  );
}

function App() {
window.addEventListener('error', function(e){ try{ if(window.__amberErr)return; window.__amberErr=1; var d=document.createElement('div'); d.setAttribute('role','alert'); d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;'; d.innerHTML='<div style="font-size:48px;margin-bottom:16px">🦊</div><div style="font-size:18px;margin-bottom:24px">Oops! Reload and try again.</div><button onclick="location.reload()" style="font-size:16px;padding:12px 24px;border:none;border-radius:8px;background:#f5a623;color:#1a1a2e;cursor:pointer;font-weight:bold;">Reload</button>'; document.body.appendChild(d); }catch(_){} });
  const [screen, setScreen] = useState('menu');
  const [level, setLevel] = useState('easy');
  const [muted, setMuted] = useState(() => { try { return localStorage.getItem('petclinic_muted') === '1'; } catch(e){ return false; } });
  const [showTut, setShowTut] = useState(() => { try { return !localStorage.getItem('petclinic_tutorial'); } catch(e){ return false; } });
  const [tick, setTick] = useState(0);
  const bests = {
    easy: loadBest('easy'),
    med: loadBest('med'),
    hard: loadBest('hard'),
  };
  const galleryCount = loadGallery().length;

  const toggleMute = () => {
    const m = !muted;
    setMuted(m);
    try { localStorage.setItem('petclinic_muted', m ? '1' : '0'); } catch (e) {}
  };

  const goMenu = () => { setScreen('menu'); setTick(t => t + 1); };

  if (screen === 'clinic') {
    return <OpenClinic level={level} muted={muted} onBack={goMenu} key={'c-' + level + '-' + tick} />;
  }
  if (screen === 'free') {
    return <FreePlay muted={muted} onBack={goMenu} />;
  }
  if (screen === 'gallery') {
    return <Gallery onBack={goMenu} />;
  }

  return (
    <>
      <BgOrbs />
      <div className="overlay">
        {showTut && (
          <Tutorial onClose={() => {
            try { localStorage.setItem('petclinic_tutorial', '1'); } catch (e) {}
            setShowTut(false);
          }} />
        )}
        <div className="card">
          <div className="menu-hero">🐾</div>
          <div className="title">Pet Clinic</div>
          <div className="sub">Amber helps hungry, sleepy, and lonely pets feel better!</div>
          <div className="section-label">Open Clinic</div>
          <div className="row">
            {Object.keys(LEVELS).map(k => (
              <button
                key={k}
                className="btn level-btn"
                onClick={() => { setLevel(k); setScreen('clinic'); blip(720, 0.08, 'sine', muted); }}
              >
                {LEVELS[k].label}
                <div className="bests">Best {bests[k] || '—'}</div>
              </button>
            ))}
          </div>
          <div className="row" style={{ marginTop: 14 }}>
            <button className="btn btn-sec" onClick={() => { setScreen('free'); blip(600, 0.07, 'sine', muted); }}>Free Play</button>
            <button className="btn btn-ghost" onClick={() => setScreen('gallery')}>
              Gallery{galleryCount ? ' (' + galleryCount + ')' : ''}
            </button>
          </div>
          <div className="row" style={{ marginTop: 8 }}>
            <button className="btn btn-ghost" onClick={toggleMute}>{muted ? '🔇' : '🔊'}</button>
            <button className="btn btn-ghost" onClick={() => setShowTut(true)}>?</button>
          </div>
        </div>
      </div>
    </>
  );
}
