const KB_MAP = {
  '1': 10, '2': 20, '3': 50,
  '4': 100, '5': 200, '6': 500, '7': 1000,
  '8': 2000, '9': 5000, '0': 10000,
  '-': 50000,
};
const KB_DENOM_LABELS = {
  10: '10\u00A2', 20: '20\u00A2', 50: '50\u00A2',
  100: '$1', 200: '$2', 500: '$5', 1000: '$10',
  2000: '$20', 5000: '$50', 10000: '$100', 50000: '$500',
};

function fmtMoney(c) {
  return '$' + (c / 100).toFixed(2);
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function to10(c) {
  return Math.round(c / 10) * 10;
}

function genItemPrice(level) {
  if (level === 'easy') return (1 + Math.floor(Math.random() * 15)) * 100;
  if (level === 'med') return 100 + Math.floor(Math.random() * 78) * 50;
  return 200 + Math.floor(Math.random() * 480) * 10;
}

function pickItems(count, level) {
  const shuffled = shuffle(ITEMS);
  return shuffled.slice(0, count).map(i => ({ ...i, price: genItemPrice(level) }));
}

function greedyChange(amount) {
  const denoms = [50000, 10000, 5000, 2000, 1000, 500, 200, 100, 50, 20, 10];
  const r = [];
  let rem = amount;
  for (const d of denoms) {
    while (rem >= d) { r.push(d); rem -= d; }
  }
  return r;
}

function genCustomer(level) {
  const item = pickItems(1, level)[0];
  let bill;
  if (level === 'hard') bill = pickRandom([10000, 20000, 50000]);
  else bill = Math.random() < 0.5 ? 5000 : 10000;
  if (bill <= item.price) bill = level === 'hard' ? 50000 : 10000;
  const persona = pickRandom(PERSONAS);
  return { persona, item, bill, change: bill - item.price };
}

function genCartRound(level) {
  const items = pickItems(6, level);
  const sz = 1 + Math.floor(Math.random() * 4);
  const chosen = shuffle(items).slice(0, sz);
  const target = chosen.reduce((s, i) => s + i.price, 0);
  const correct = items.map(i => chosen.some(c => c.e === i.e && c.price === i.price));
  return { items, target, correct };
}

function genDeal(level) {
  const item = pickRandom(ITEMS);
  if (level === 'easy') {
    const qty = pickRandom([2, 3, 4]);
    const bp = 2 + Math.floor(Math.random() * 6);
    const p1 = bp * qty;
    const p2 = (bp + pickRandom([1, 2, 3])) * qty;
    return {
      cards: [
        { text: qty + ' for ' + fmtMoney(p1 * 100), unitPrice: bp * 100, e: item.e, n: item.name },
        { text: qty + ' for ' + fmtMoney(p2 * 100), unitPrice: p2 * 100, e: item.e, n: item.name },
      ],
      bestIdx: 0,
    };
  }
  if (level === 'med') {
    const q1 = pickRandom([2, 3, 4]);
    const q2 = q1 + 1 + Math.floor(Math.random() * 2);
    const u1 = (2 + Math.floor(Math.random() * 6)) * 100;
    let u2;
    do { u2 = to10(Math.max(50, u1 - 30 + Math.floor(Math.random() * 60))); } while (u2 === u1);
    const t1 = u1 * q1;
    const t2 = u2 * q2;
    const cards = [
      { text: q1 + ' for ' + fmtMoney(t1), unitPrice: u1, e: item.e, n: item.name },
      { text: q2 + ' for ' + fmtMoney(t2), unitPrice: u2, e: item.e, n: item.name },
    ];
    const bestIdx = cards[0].unitPrice < cards[1].unitPrice ? 0 : 1;
    return { cards, bestIdx };
  }
  const baseUnit = 30 + Math.floor(Math.random() * 30) * 10;
  const a = baseUnit;
  const b = baseUnit + 20 + Math.floor(Math.random() * 2) * 10;
  const c = Math.max(b + 20 + Math.floor(Math.random() * 3) * 10, b + 20);
  const units = [a, b, c];
  const shuffledUnits = shuffle(units);
  const formats = shuffle(['multi', 'percent', 'bogo']);
  const cards = shuffledUnits.map((unit, i) => {
    const fmt = formats[i];
    let text;
    if (fmt === 'multi') {
      const qty = pickRandom([2, 3, 4]);
      text = qty + ' for ' + fmtMoney(unit * qty);
    } else if (fmt === 'percent') {
      const pct = pickRandom([10, 20, 25, 30]);
      const orig = to10(unit / (1 - pct / 100));
      text = fmtMoney(orig) + ' \u00B7 ' + pct + '% off';
    } else {
      const total = to10(unit * 2);
      text = 'Buy 1 Get 1 Free \u00B7 ' + fmtMoney(total);
    }
    return { text, unitPrice: unit, e: item.e, n: item.name };
  });
  const bestIdx = cards.indexOf(cards.find(c => c.unitPrice === a));
  return { cards, bestIdx };
}

let audioCtx = null;
let toastIdCounter = 0;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function isMuted() { return window.__muted === true; }
function blip(f0, f1, dur, type, vol) {
  if (!audioCtx || isMuted()) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(kind) {
  if (!audioCtx || isMuted()) return;
  if (kind === 'correct') { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, f, 0.14, 'triangle', 0.14), i * 60)); }
  else if (kind === 'wrong') { blip(180, 90, 0.18, 'square', 0.14); }
  else if (kind === 'lose') { blip(220, 50, 0.5, 'square', 0.18); }
  else if (kind === 'win') { [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, f, 0.3, 'triangle', 0.18), i * 90)); }
  else if (kind === 'coin') { blip(880, 1100, 0.07, 'sine', 0.10); }
  else if (kind === 'tick') { blip(440, 880, 0.05, 'sine', 0.06); }
}
function sfxChime(freq) {
  if (!audioCtx || isMuted()) return;
  blip(freq, freq, 0.18, 'sine', 0.10);
  setTimeout(() => blip(freq * 1.5, freq * 1.5, 0.12, 'sine', 0.08), 60);
}

function useToast() {
  const [toast, setToast] = useState(null);
  const showToast = useCallback((text, color) => {
    const id = ++toastIdCounter;
    setToast({ text, color, id });
    setTimeout(() => setToast(curr => curr && curr.id === id ? null : curr), 1600);
  }, []);
  return [toast, showToast];
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { try { console.error('Shop game crashed:', err, info); } catch (e) {} }
  render() {
    if (this.state.err) {
      return (
        <div className="overlay menu-screen">
          <div className="menu-card">
            <div className="title" style={{ color: COLORS.danger }}>Oops!</div>
            <div className="subtitle">Something went wrong. Let's start over.</div>
            <div className="btn-row" style={{ marginTop: 12 }}>
              <button className="btn" onClick={() => { try { ['shop_tutorial','shop_pick','shop_lvl','shop_muted'].concat(['cc','sc','bd'].flatMap(g=>['easy','med','hard'].map(l=>`shop_best_${g}_${l}`))).forEach(k=>localStorage.removeItem(k)); } catch (e) {} window.location.reload(); }}>Restart</button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function IconButton({ onClick, children, title }) {
  return <button className="icon-btn" onClick={onClick} title={title}>{children}</button>;
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div key={msg.id} className="toast" style={{ color: msg.color || COLORS.accent }}>{msg.text}</div>;
}

function HUD({ score, meta, muted, onToggleMute, onPause }) {

    <div className="hud">
      <div className="hud-left">
        <div className="score">{'\u2605'}{score}</div>
        <div className="meta">{meta}</div>
      </div>
      <div className="hud-right">
        <div className="hud-buttons">
          <IconButton onClick={onToggleMute} title={muted ? 'Sound off' : 'Sound on'}>{muted ? '\u{1F507}' : '\u{1F50A}'}</IconButton>
          <IconButton onClick={onPause} title="Pause">{'\u23F8'}</IconButton>
        </div>
      </div>
    </div>
  );
}

function CashiersCounter({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const ROUND_TIME = 60;
  const lvl = safeLevel(level);
  const [customer, setCustomer] = useState(() => genCustomer(lvl));
  const [tray, setTray] = useState([]);
  const [score, setScore] = useState(0);
  const [time, setTime] = useState(ROUND_TIME);
  const [mistakes, setMistakes] = useState(0);
  const [toast, showToast] = useToast();
  const [served, setServed] = useState(0);
  const [wrongCount, setWrongCount] = useState(0);
  const gameOverRef = useRef(false);
  const scoreRef = useRef(score);
  const servedRef = useRef(served);
  const wrongCountRef = useRef(wrongCount);
  const trayRef = useRef(tray);
  const pausedRef = useRef(paused);
  scoreRef.current = score;
  servedRef.current = served;
  wrongCountRef.current = wrongCount;
  trayRef.current = tray;
  pausedRef.current = paused;

  useEffect(() => {
    if (paused || gameOverRef.current) return;
    const iv = setInterval(() => {
      setTime(t => {
        if (t <= 1) { setTime(0); return 0; }
        if (t <= 6 && t > 1) sfx('tick');
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [paused]);

  useEffect(() => {
    if (time > 0 || gameOverRef.current) return;
    finishRound();
  }, [time]);

  const denoms = DENOMS[lvl] || DENOMS.med;

  const addCoin = useCallback((v) => {
    if (pausedRef.current || gameOverRef.current) return;
    initAudio();
    sfx('coin');
    setTray(t => [...t, v]);
  }, []);

  const removeLast = useCallback(() => {
    if (pausedRef.current || gameOverRef.current || tray.length === 0) return;
    setTray(t => t.slice(0, -1));
  }, [tray]);

  const handleConfirm = useCallback(() => {
    if (pausedRef.current || gameOverRef.current) return;
    const total = trayRef.current.reduce((s, v) => s + v, 0);
    if (total === customer.change) {
      sfx('correct');
      const pts = Math.round(Math.max(1, 10 - mistakes) * (customer.persona ? customer.persona.tipMul : 1));
      setScore(s => s + pts);
      setServed(s => s + 1);
      setMistakes(0);
      showToast('+' + pts + (customer.persona && customer.persona.mood === 'happy' ? ' \uD83D\uDC4B' : ''), COLORS.green);
      sfxChime(customer.persona ? customer.persona.chime : 880);
      const next = genCustomer(lvl);
      setTimeout(() => {
        setCustomer(next);
        setTray([]);
        sfxChime(next.persona ? next.persona.chime : 880);
      }, 600);
    } else {
      sfx('wrong');
      setMistakes(m => m + 1);
      setWrongCount(w => w + 1);
      const diff = Math.abs(total - customer.change);
      showToast('Need ' + fmtMoney(customer.change) + ', gave ' + fmtMoney(total) + ' (diff ' + fmtMoney(diff) + ')', COLORS.danger);
    }
  }, [customer, lvl, mistakes, showToast]);

  const skipCustomer = useCallback(() => {
    if (pausedRef.current || gameOverRef.current) return;
    setMistakes(0);
    setWrongCount(w => w + 1);
    const next = genCustomer(lvl);
    setCustomer(next);
    setTray([]);
  }, [lvl]);

  function finishRound() {
    if (gameOverRef.current) return;
    gameOverRef.current = true;
    const s = scoreRef.current, sv = servedRef.current, wc = wrongCountRef.current;
    if (sv > wc) sfx('win'); else sfx('lose');
    setTimeout(() => onFinish({
      score: s,
      accuracy: (sv + wc) > 0 ? Math.round(100 * sv / (sv + wc)) : 0,
      rounds: sv,
    }), 700);
  }

  const trayTotal = tray.reduce((s, v) => s + v, 0);
  const trayMap = {};
  tray.forEach(v => { trayMap[v] = (trayMap[v] || 0) + 1; });

  useEffect(() => {
    if (paused) return;
    const handler = (e) => {
      if (gameOverRef.current || pausedRef.current) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter') { e.preventDefault(); handleConfirm(); return; }
      if (e.key === 'Backspace') { e.preventDefault(); removeLast(); return; }
      if (e.key === 'Escape') { e.preventDefault(); onPause(); return; }
      const val = KB_MAP[e.key];
      if (val !== undefined && denoms.some(d => d.v === val)) {
        e.preventDefault();
        addCoin(val);
      }
    };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [paused, denoms, handleConfirm, removeLast, addCoin, onPause]);

  return (
    <>
      <div className="stage stage-counter" />
      <HUD score={score} meta={"Cashier's Counter \u00B7 " + DIFFICULTIES[lvl].label + ' \u00B7 ' + time + 's'}
           muted={muted} onToggleMute={toggleMute} onPause={onPause} />
      <div className="timer-bar"><div style={{ width: (time / ROUND_TIME) * 100 + '%' }} /></div>
      <div className="cc-area">
        <div className={'cc-customer mood-' + (customer.persona ? customer.persona.mood : 'neutral')}>
          <div className="cc-customer-emoji">{customer.persona ? customer.persona.emoji : '\u{1F9D1}'}</div>
          {customer.persona && <div className="cc-customer-line">{customer.persona.line}</div>}
        </div>
        <div className="cc-item-row">
          <span className="emoji">{customer.item.e}</span>
          <span>{customer.item.name}</span>
          <span style={{ opacity: 0.7 }}>— {fmtMoney(customer.item.price)}</span>
        </div>
        <div className="cc-info">
          <span className="paid">Paid: {fmtMoney(customer.bill)}</span>
          <span className="owed">Change: {fmtMoney(customer.change)}</span>
        </div>
        <div className="cc-change-label">Your change:</div>
        <div className={'cc-total ' + (trayTotal === customer.change ? 'match' : trayTotal > 0 ? 'no-match' : '')}>
          {trayTotal === 0 ? '\u2014' : fmtMoney(trayTotal)}
          {trayTotal > 0 && trayTotal !== customer.change && <span style={{ fontSize: '0.6em', opacity: 0.6, marginLeft: 8 }}>({fmtMoney(Math.abs(customer.change - trayTotal))} off)</span>}
        </div>
        <div className="cc-tray-display">
          {tray.length === 0 && <span style={{ fontSize: 13, opacity: 0.4 }}>Tap coins below to add</span>}
          {Object.keys(trayMap).map(v => (
            <div key={v} className="cc-tray-chip" onClick={() => {
              const vn = parseInt(v, 10);
              setTray(t => { const idx = t.lastIndexOf(vn); return idx >= 0 ? [...t.slice(0, idx), ...t.slice(idx + 1)] : t; });
            }}>
              {KB_DENOM_LABELS[parseInt(v, 10)] || fmtMoney(parseInt(v, 10))}
              {trayMap[v] > 1 && ' x' + trayMap[v]}
            </div>
          ))}
        </div>
        <div className="coin-tray">
          {denoms.map(d => (
            <div key={d.v} className="coin-chip" onClick={() => addCoin(d.v)} title={'Keyboard: ' + Object.keys(KB_MAP).find(k => KB_MAP[k] === d.v)}>
              <div className="amt">{d.label}</div>
              <div className="sub">{'\u{1FA99}'}</div>
            </div>
          ))}
        </div>
        <div className="cc-actions">
          <button className="btn btn-ghost btn-small" onClick={removeLast} disabled={tray.length === 0}>Undo</button>
          <button className="btn btn-small" onClick={handleConfirm} disabled={trayTotal === 0}>Give Change</button>
          <button className="btn btn-ghost btn-small" onClick={skipCustomer}>Skip</button>
        </div>
      </div>
      <Toast msg={toast} />
      <div className="kb-hint">1\u20130, Enter, Backspace, Esc</div>
    </>
  );
}

function SmartCart({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const ROUNDS = 5;
  const lvl = safeLevel(level);
  const [round, setRound] = useState(0);
  const [deal, setDeal] = useState(() => genCartRound(lvl));
  const [cart, setCart] = useState([]);
  const [score, setScore] = useState(0);
  const [hits, setHits] = useState(0);
  const [toast, showToast] = useToast();
  const [feedback, setFeedback] = useState(null);
  const gameOverRef = useRef(false);
  const pausedRef = useRef(paused);
  pausedRef.current = paused;

  const toggleItem = useCallback((item) => {
    if (pausedRef.current || gameOverRef.current || feedback) return;
    setCart(c => {
      const idx = c.findIndex(i => i.e === item.e && i.price === item.price);
      if (idx >= 0) return [...c.slice(0, idx), ...c.slice(idx + 1)];
      return [...c, item];
    });
  }, [feedback]);

  const cartTotal = cart.reduce((s, i) => s + i.price, 0);

  const submitCart = useCallback(() => {
    if (pausedRef.current || gameOverRef.current || feedback) return;
    if (cart.length === 0) { showToast('Pick at least one item!', COLORS.danger); return; }
    const exact = cartTotal === deal.target;
    let pts = 0;
    if (exact) { pts = 20; setHits(h => h + 1); sfx('correct'); }
    else { sfx('wrong'); pts = 0; }
    setScore(s => s + pts);
    if (exact) showToast('+' + pts + ' \u2713', COLORS.green);
    else showToast('Target ' + fmtMoney(deal.target) + ', got ' + fmtMoney(cartTotal), COLORS.danger);

    const nextRound = round + 1;
    if (nextRound >= ROUNDS) {
      setFeedback({ exact, highlight: deal.correct, items: deal.items, target: deal.target });
      setTimeout(() => {
        gameOverRef.current = true;
        if (score + pts > 0) sfx('win'); else sfx('lose');
        setTimeout(() => onFinish({ score: score + pts, accuracy: Math.round(100 * (hits + (exact ? 1 : 0)) / ROUNDS), rounds: ROUNDS }), 700);
      }, 1200);
    } else {
      setFeedback({ exact, highlight: deal.correct, items: deal.items, target: deal.target });
      setTimeout(() => {
        setFeedback(null);
        setCart([]);
        setDeal(genCartRound(lvl));
        setRound(nextRound);
      }, 1200);
    }
  }, [cartTotal, deal, round, lvl, cart, feedback, score, hits, showToast]);

  return (
    <>
      <div className="stage stage-cart" />
      <HUD score={score} meta={'Smart Cart \u00B7 ' + DIFFICULTIES[lvl].label + ' \u00B7 Round ' + (round + 1) + '/' + ROUNDS}
           muted={muted} onToggleMute={toggleMute} onPause={onPause} />
      <div className="sc-area">
        <div className="sc-round">Round {round + 1} of {ROUNDS}</div>
        <div className="sc-target">
          <div className="label">Get exactly</div>
          <div className="amount">{fmtMoney(deal.target)}</div>
        </div>
        <div className="sc-shelf">
          {deal.items.map((item, i) => {
            const inCart = cart.some(c => c.e === item.e && c.price === item.price);
            const isHighlight = feedback && feedback.highlight[i];
            return (
              <div key={item.e + '-' + item.price + '-' + i}
                   className={'sc-item' + (inCart ? ' selected' : '') + (isHighlight && !inCart ? ' highlight' : '')}
                   onClick={() => toggleItem(item)}>
                <div className="emoji">{item.e}</div>
                <div className="iname">{item.name}</div>
                <div className="iprice">{fmtMoney(item.price)}</div>
              </div>
            );
          })}
        </div>
        <div className="sc-cart-bar">
          {cart.length === 0 && <span style={{ fontSize: 13, opacity: 0.4 }}>Tap items to add to cart</span>}
          {cart.map((item, i) => (
            <div key={i} className="sc-cart-chip" onClick={() => toggleItem(item)}>
              {item.e} {fmtMoney(item.price)}
            </div>
          ))}
        </div>
        <div className="sc-total-row">
          <span>Cart: </span>
          <span className={cartTotal === deal.target ? 'match' : cartTotal > 0 ? 'current' : ''}>
            {fmtMoney(cartTotal)}
          </span>
          <span style={{ opacity: 0.5 }}>of</span>
          <span className="target">{fmtMoney(deal.target)}</span>
        </div>
        <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 4, flexShrink: 0 }}>
          <button className="btn btn-small" onClick={submitCart} disabled={cart.length === 0}>Submit Cart</button>
        </div>
      </div>
      <Toast msg={toast} />
    </>
  );
}

function BestDeal({ level, onFinish, onPause, toggleMute, muted, paused }) {
  const ROUND_TIME = 60;
  const lvl = safeLevel(level);
  const perPickTime = lvl === 'easy' ? 3500 : lvl === 'med' ? 3000 : 2500;
  const [deal, setDeal] = useState(() => genDeal(lvl));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [time, setTime] = useState(ROUND_TIME);
  const [total, setTotal] = useState(0);
  const [hits, setHits] = useState(0);
  const [toast, showToast] = useToast();
  const [perPickLeft, setPerPickLeft] = useState(perPickTime);
  const gameOverRef = useRef(false);
  const scoreRef = useRef(score);
  const totalRef = useRef(total);
  const hitsRef = useRef(hits);
  const pickedRef = useRef(picked);
  const pausedRef = useRef(paused);
  scoreRef.current = score;
  totalRef.current = total;
  hitsRef.current = hits;
  pickedRef.current = picked;
  pausedRef.current = paused;

  useEffect(() => { setPerPickLeft(perPickTime); }, [deal, perPickTime]);

  useEffect(() => {
    if (paused || gameOverRef.current || picked !== null) return;
    const iv = setInterval(() => {
      setPerPickLeft(t => Math.max(0, t - 100));
    }, 100);
    return () => clearInterval(iv);
  }, [deal, paused, picked, perPickTime]);

  useEffect(() => {
    if (paused || gameOverRef.current) return;
    const iv = setInterval(() => {
      setTime(t => {
        if (t <= 1) { setTime(0); return 0; }
        if (t <= 6 && t > 1) sfx('tick');
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [paused]);

  useEffect(() => {
    if (time > 0 || gameOverRef.current) return;
    finishGame();
  }, [time]);

  useEffect(() => {
    if (paused || gameOverRef.current) return;
    const timer = setTimeout(() => {
      if (pickedRef.current === null) handlePick(-1);
    }, perPickTime);
    return () => clearTimeout(timer);
  }, [deal, paused, perPickTime]);

  function handlePick(idx) {
    if (pickedRef.current !== null) return;
    setPicked(idx);
    setTotal(t => t + 1);

    if (idx >= 0 && idx === deal.bestIdx) {
      sfx('correct');
      const ns = streak + 1;
      const mult = ns >= 10 ? 4 : ns >= 6 ? 3 : ns >= 3 ? 2 : 1;
      const pts = 5 * mult;
      setScore(s => s + pts);
      setStreak(ns);
      setHits(h => h + 1);
      showToast('+' + pts + ' \u00D7' + mult, COLORS.accent);
    } else {
      sfx('wrong');
      setStreak(0);
    }

    setTimeout(() => {
      if (gameOverRef.current) return;
      setPicked(null);
      setDeal(genDeal(lvl));
    }, 1000);
  }

  function finishGame() {
    if (gameOverRef.current) return;
    gameOverRef.current = true;
    const s = scoreRef.current, t = totalRef.current, h = hitsRef.current;
    if (t > h) sfx('lose'); else sfx('win');
    setTimeout(() => onFinish({
      score: s,
      accuracy: t > 0 ? Math.round(100 * h / t) : 0,
      rounds: t,
    }), 700);
  }

  const streakMult = streak >= 10 ? 4 : streak >= 6 ? 3 : streak >= 3 ? 2 : 1;

  return (
    <>
      <div className="stage stage-deal" />
      <HUD score={score} meta={'Best Deal \u00B7 ' + DIFFICULTIES[lvl].label + ' \u00B7 ' + time + 's'}
           muted={muted} onToggleMute={toggleMute} onPause={onPause} />
      <div className="timer-bar"><div style={{ width: (time / ROUND_TIME) * 100 + '%' }} /></div>
      <div className="bd-area">
        <div className="bd-prompt">
          <span style={{ fontSize: '1.3em', marginRight: 8 }}>{deal.cards[0].e}</span>
          Best deal?
        </div>
        <div className="bd-cards">
          {deal.cards.map((card, i) => {
            let cls = 'bd-card';
            if (picked !== null) cls += ' reveal';
            if (i === picked && picked === deal.bestIdx) cls += ' correct';
            else if (i === picked && picked !== deal.bestIdx) cls += ' wrong';
            else if (picked !== null && deal.bestIdx === i) cls += ' correct';
            else if (picked !== null && i !== deal.bestIdx) cls += ' wrong';

            return (
              <div key={i} className={cls} onClick={() => handlePick(i)}>
                <div className="emoji">{card.e}</div>
                <div className="offer">{card.text}</div>
                <div className="unit-label"> = {fmtMoney(card.unitPrice)}/ea</div>
                {picked !== null && i === deal.bestIdx && <div className="check-mark">{'\u2705'}</div>}
                {picked !== null && i === picked && picked !== deal.bestIdx && <div className="check-mark">{'\u274C'}</div>}
              </div>
            );
          })}
        </div>
        <div className="bd-streak">
          {streak > 0 && <span className="fire">{'\u{1F525}'} Streak {streak} \u00D7{streakMult}</span>}
          {streak === 0 && <span style={{ opacity: 0.3 }}>Pick the cheapest deal!</span>}
        </div>
        {picked === null && <div style={{ height: 3, margin: '4px 20px', background: 'rgba(255,255,255,0.1)', borderRadius: 2, overflow: 'hidden', flexShrink: 0 }}>
          <div style={{ width: (perPickLeft / perPickTime) * 100 + '%', height: '100%', background: 'var(--accent)', transition: 'width 0.1s linear', borderRadius: 2 }} />
        </div>}
      </div>
      <Toast msg={toast} />
    </>
  );
}

function GameOver({ result, game, level, onReplay, onMenu, best }) {
  const newRecord = result.score > best;
  const title = newRecord ? 'New Record!' : "Time's Up!";
  const titleColor = newRecord ? COLORS.sec1 : COLORS.accent;
  const g = GAMES.find(g => g.id === game);
  const [receiptOut, setReceiptOut] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setReceiptOut(true), 900);
    return () => clearTimeout(t1);
  }, []);
  return (
    <div className="overlay menu-screen">
      <div className="menu-card">
        <div className="title" style={{ color: titleColor }}>{title}</div>
        <div className="subtitle">{g ? g.name : ''} {'\u00B7'} {(DIFFICULTIES[safeLevel(level)] || DIFFICULTIES.med).label}</div>
        <div className={'receipt ' + (receiptOut ? 'out' : '')}>
          <div className="receipt-line"><span>Subtotal</span><span>{result.rounds || 0} orders</span></div>
          <div className="receipt-line"><span>Accuracy</span><span>{result.accuracy}%</span></div>
          <div className="receipt-line big"><span>Total</span><span>{'\u2605'}{result.score}</span></div>
        </div>
        <div className="stat-line">
          <div className="stat"><div className="v">{'\u2605'}{result.score}</div><div className="l">Score</div></div>
          <div className="stat"><div className="v">{result.accuracy}%</div><div className="l">Accuracy</div></div>
          <div className="stat"><div className="v">{result.rounds || 0}</div><div className="l">Rounds</div></div>
        </div>
        {newRecord && <div className="best record" style={{ marginTop: 14 }}>{'\u{1F3C6}'} New Record!</div>}
        {!newRecord && best > 0 && <div className="best">Best: <span className="record">{'\u2605'}{best}</span></div>}
        <div className="btn-row" style={{ marginTop: 16 }}>
          <button className="btn" onClick={onReplay}>Play Again</button>
          <button className="btn btn-secondary" onClick={onMenu}>Back to Menu</button>
        </div>
      </div>
    </div>
  );
}

function PauseOverlay({ onResume, onMenu }) {
  return (
    <div className="overlay pause-overlay">
      <div className="menu-card">
        <div className="title" style={{ fontSize: 'clamp(28px, 6vw, 48px)' }}>Paused</div>
        <div className="subtitle" style={{ marginBottom: 18 }}>Take a break!</div>
        <div className="btn-row">
          <button className="btn" onClick={onResume}>Resume</button>
          <button className="btn btn-ghost" onClick={onMenu}>Back to Menu</button>
        </div>
      </div>
    </div>
  );
}

function Tutorial({ onDismiss }) {
  return (
    <div className="overlay" style={{ zIndex: 30, pointerEvents: 'auto', background: 'rgba(13,27,58,0.72)' }}>
      <div className="menu-card" style={{ maxWidth: 340 }}>
        <div className="title" style={{ fontSize: 28 }}>How to Play</div>
        <div className="subtitle" style={{ fontSize: 13, opacity: 0.8, marginBottom: 8 }}>
          Practice your money skills!
        </div>
        <ul style={{ textAlign: 'left', fontSize: 13, lineHeight: 1.5, opacity: 0.8, paddingLeft: 20, marginBottom: 12 }}>
          <li>Cashier: make exact change for each customer</li>
          <li>Smart Cart: fill your cart to hit the target total</li>
          <li>Best Deal: find the cheapest unit price</li>
        </ul>
        <div className="btn-row">
          <button type="button" className="btn" onClick={() => {
            try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
            onDismiss();
          }}>Let's Go!</button>
        </div>
      </div>
    </div>
  );
}

function Menu({ onStart, bests, muted, toggleMute }) {
  const [showTut, setShowTut] = useState(() => { try { return !localStorage.getItem(TUTORIAL_KEY); } catch (e) { return false; } });
  const [selected, setSelected] = useState(() => {
    try { return safeGame(localStorage.getItem('shop_pick')); } catch (e) { return 'cc'; }
  });
  const [level, setLevel] = useState(() => {
    try { return safeLevel(localStorage.getItem('shop_lvl')); } catch (e) { return 'med'; }
  });

  useEffect(() => { try { localStorage.setItem('shop_pick', safeGame(selected)); } catch (e) {} }, [selected]);
  useEffect(() => { try { localStorage.setItem('shop_lvl', safeLevel(level)); } catch (e) {} }, [level]);

  const handleStart = () => {
    const g = safeGame(selected);
    const l = safeLevel(level);
    setSelected(g);
    setLevel(l);
    try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
    setShowTut(false);
    initAudio();
    onStart(g, l);
  };

  const lvl = safeLevel(level);
  const hasBest = bests.cc[lvl] > 0 || bests.sc[lvl] > 0 || bests.bd[lvl] > 0;

  return (
    <div className="overlay menu-screen">
      {showTut && <Tutorial onDismiss={() => setShowTut(false)} />}
      <div className="menu-card">
        <div className="title">Shop with Amber</div>
        <div className="subtitle">Pick a game and start shopping!</div>
        <div className="game-grid">
          {GAMES.map(g => (
            <div key={g.id} className={'game-card' + (selected === g.id ? ' selected' : '')} onClick={() => setSelected(g.id)}>
              <div className="mascot">{g.mascot}</div>
              <div className="name">{g.name}</div>
              <div className="blurb">{g.blurb}</div>
            </div>
          ))}
        </div>
        <div className="diff-row">
          <span>Difficulty:</span>
          {VALID_LEVELS.map(d => (
            <button type="button" key={d} className={'diff-btn' + (lvl === d ? ' active' : '')} onClick={() => setLevel(d)}>
              {DIFFICULTIES[d].label}
            </button>
          ))}
        </div>
        <div className="btn-row">
          <button type="button" className="btn" onClick={handleStart}>Start Game</button>
          <button type="button" className="btn btn-ghost" onClick={toggleMute}>
            {muted ? '\u{1F507} Muted' : '\u{1F50A} Sound'}
          </button>
          <button type="button" className="btn btn-ghost" onClick={() => { try { localStorage.removeItem(TUTORIAL_KEY); } catch (e) {} setShowTut(true); }}>?</button>
        </div>
        {hasBest ? (
          <div className="best" style={{ marginTop: 12 }}>
            <span className="record">Best ({DIFFICULTIES[lvl].label})</span>:
            {' '}{'\u{1F9D1}\u200D\u{1F4BC}'} {bests.cc[lvl]} {'\u00B7'}
            {' '}{'\u{1F6D2}'} {bests.sc[lvl]} {'\u00B7'}
            {' '}{'\u{1F3F7}\uFE0F'} {bests.bd[lvl]}
          </div>
        ) : <div className="best">Let's go shopping!</div>}
      </div>
    </div>
  );
}

function App() {
window.addEventListener('error', function(e){ try{ if(window.__amberErr)return; window.__amberErr=1; var d=document.createElement('div'); d.setAttribute('role','alert'); d.style.cssText='position:fixed;inset:0;z-index:9999;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;'; d.innerHTML='<div style="font-size:48px;margin-bottom:16px">🦊</div><div style="font-size:18px;margin-bottom:24px">Oops! Reload and try again.</div><button onclick="location.reload()" style="font-size:16px;padding:12px 24px;border:none;border-radius:8px;background:#f5a623;color:#1a1a2e;cursor:pointer;font-weight:bold;">Reload</button>'; document.body.appendChild(d); }catch(_){} });
  const [screen, setScreen] = useState('menu');
  const [game, setGame] = useState(null);
  const [level, setLevel] = useState('med');
  const [result, setResult] = useState(null);
  const [playKey, setPlayKey] = useState(0);
  const [paused, setPaused] = useState(false);
  const [muted, setMuted] = useState(() => {
    try { return localStorage.getItem('shop_muted') === '1'; } catch (e) { return false; }
  });
  const [bests, setBests] = useState(() => {
    const out = { cc: { easy: 0, med: 0, hard: 0 }, sc: { easy: 0, med: 0, hard: 0 }, bd: { easy: 0, med: 0, hard: 0 } };
    try {
      for (const g of ['cc','sc','bd']) for (const l of ['easy','med','hard']) {
        const v = parseInt(localStorage.getItem('shop_best_' + g + '_' + l) || '0', 10);
        if (!isNaN(v)) out[g][l] = v;
      }
    } catch (e) {}
    return out;
  });

  const toggleMute = useCallback(() => {
    setMuted(m => {
      const next = !m;
      try { localStorage.setItem('shop_muted', next ? '1' : '0'); } catch (e) {}
      window.__muted = next;
      return next;
    });
  }, []);

  useEffect(() => { window.__muted = muted; }, [muted]);

  const onStart = (g, l) => {
    const gameId = safeGame(g);
    const lvl = safeLevel(l);
    setGame(gameId);
    setLevel(lvl);
    setResult(null);
    setPaused(false);
    setPlayKey(k => k + 1);
    setScreen('play');
  };
  const onFinish = (r) => {
    setResult(r);
    const gameId = safeGame(game);
    const lvl = safeLevel(level);
    if (r.score > 0) {
      setBests(curr => {
        const next = {
          ...curr,
          [gameId]: { ...curr[gameId], [lvl]: Math.max((curr[gameId] && curr[gameId][lvl]) || 0, r.score) },
        };
        try { localStorage.setItem('shop_best_' + gameId + '_' + lvl, String(next[gameId][lvl])); } catch (e) {}
        return next;
      });
    }
    setScreen('over');
  };
  const onPause = () => setPaused(true);
  const onResume = () => setPaused(false);
  const onReplay = () => { setResult(null); setPaused(false); setPlayKey(k => k + 1); setScreen('play'); };
  const onMenu = () => { setScreen('menu'); setResult(null); setPaused(false); };

  return (
    <>
      {screen === 'menu' && <Menu onStart={onStart} bests={bests} muted={muted} toggleMute={toggleMute} />}
      {screen === 'play' && game === 'cc' && <CashiersCounter key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && game === 'sc' && <SmartCart key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && game === 'bd' && <BestDeal key={playKey} level={level} onFinish={onFinish} onPause={onPause} toggleMute={toggleMute} muted={muted} paused={paused} />}
      {screen === 'play' && paused && <PauseOverlay onResume={onResume} onMenu={onMenu} />}
      {screen === 'over' && result && game && (
        <GameOver
          result={result}
          game={safeGame(game)}
          level={safeLevel(level)}
          best={(bests[safeGame(game)] && bests[safeGame(game)][safeLevel(level)]) || 0}
          onReplay={onReplay}
          onMenu={onMenu}
        />
      )}
    </>
  );
}

root.render(<ErrorBoundary><App /></ErrorBoundary>);

</script>
